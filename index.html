      if (state.q1.answers[n] !== undefined || !activeList[n]) return;

      const q = activeList[n];
      state.q1.answers[n] = j;
      const ok = j === q.a;
      if (!ok && !state.q1.wrongIds.includes(q.id)) {
        state.q1.wrongIds.push(q.id);
      }

      const done = Object.keys(state.q1.answers).length;
      if (done === activeList.length) {
        const score = Object.keys(state.q1.answers).filter((k) => {
          const item = activeList[Number(k)];
          return item && state.q1.answers[k] === item.a;
        }).length;
        const pct = Math.round((score / activeList.length) * 100);
        state.q1.history.unshift({
          date: new Date().toLocaleString("zh-TW"),
          score,
          total: activeList.length,
          pct,
          mode: state.q1.wrongMode ? "錯題重測" : "一般測驗"
        });
        state.q1.history = state.q1.history.slice(0, 30);
      }

      saveState();
      renderQ1();
    }

    function q1ToggleHistoryBox() {
      const box = document.getElementById("q1-history-box");
      const listEl = document.getElementById("q1-history-list");
      if (!box || !listEl) return;
      const willShow = box.classList.contains("hidden");
      box.classList.toggle("hidden", !willShow);
      if (willShow) {
        const h = state.q1.history || [];
        listEl.innerHTML = h.length
          ? h.map((x, i) => `<div class="py-1.5">${i + 1}. ${escapeHtml(x.date)}｜${escapeHtml(x.mode)}｜${x.score}/${x.total} 題（${x.pct}%）</div>`).join("")
          : "尚無成績紀錄。紀錄只保存在目前瀏覽器的本機裝置。";
      }
    }

    function q1ClearHistory() {
      state.q1.history = [];
      saveState();
      const listEl = document.getElementById("q1-history-list");
      if (listEl) listEl.innerHTML = "尚無成績紀錄。紀錄只保存在目前瀏覽器的本機裝置。";
      showToast("已清除本機成績紀錄。");
    }

    /* -------------------------------------------------------------------------
       7B. QUIZ 2 LOGIC: 七上K版國文二段｜200題線上測驗
       ------------------------------------------------------------------------- */
    function getQ2FilteredIndices() {
      const cat = state.q2.cat || "全部";
      const wrongOnlyView = !!state.q2.wrongOnlyView;
      const ansMap = state.q2.answers || {};

      return QUIZ2_BANK
        .map((item, idx) => ({ item, idx }))
        .filter(({ item, idx }) => {
          if (cat !== "全部" && item.cat !== cat) return false;
          if (wrongOnlyView) {
            return ansMap[idx] !== undefined && ansMap[idx] !== item.ans;
          }
          return true;
        })
        .map(({ idx }) => idx);
    }

    function rebuildQ2Order(forceShuffle = null) {
      const matching = getQ2FilteredIndices();
      const shouldShuffle = forceShuffle !== null ? forceShuffle : !!state.q2.shuffle;
      state.q2.order = shouldShuffle ? shuffleIndices(matching) : matching;
      state.q2.wrongOnlyView = false;
      state.q2.showAllAnswers = false;
      saveState();
    }

    function initAndRenderQ2() {
      if (!Array.isArray(state.q2.order) || state.q2.order.length === 0) {
        const indices = QUIZ2_BANK.map((_, i) => i);
        state.q2.order = state.q2.shuffle ? shuffleIndices(indices) : indices;
        saveState();
      }
      renderQ2();
    }

    function renderQ2() {
      const mount = document.getElementById("chinese-quiz-mount");
      if (!mount) return;

      const cats = [...new Set(QUIZ2_BANK.map((x) => x.cat))];
      const order = state.q2.order || [];
      const ansMap = state.q2.answers || {};
      const letters = ["A", "B", "C", "D"];

      const doneCount = order.filter((origIdx) => ansMap[origIdx] !== undefined).length;
      const rightCount = order.filter((origIdx) => ansMap[origIdx] !== undefined && ansMap[origIdx] === QUIZ2_BANK[origIdx].ans).length;
      const rate = doneCount ? Math.round((rightCount / doneCount) * 100) : 0;
      const barPct = order.length ? (doneCount / order.length) * 100 : 0;

      mount.innerHTML = `
        <div class="space-y-4">
          <div class="rounded-2xl bg-gradient-to-r from-[#263b80] to-[#687be8] text-white p-5">
            <h4 class="text-xl sm:text-2xl font-extrabold">七上K版國文二段｜200題線上測驗</h4>
            <p class="text-blue-100 text-xs sm:text-sm mt-1">字音字形・字詞辨析・成語與詞義・論語文言・課文理解・閱讀測驗</p>
          </div>

          <!-- Controls -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-wrap gap-2.5 items-center text-xs sm:text-sm">
            <label class="flex items-center gap-1.5 font-semibold text-slate-700">
              類別
              <select onchange="q2ChangeCat(this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-800 font-medium">
                <option value="全部" ${state.q2.cat === "全部" ? "selected" : ""}>全部</option>
                ${cats.map((c) => `<option value="${escapeHtml(c)}" ${state.q2.cat === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
              </select>
            </label>
            <label class="inline-flex items-center gap-1.5 px-2.5 py-2 rounded-xl bg-white border border-slate-200 cursor-pointer font-medium text-slate-700">
              <input type="checkbox" ${state.q2.shuffle ? "checked" : ""} onchange="q2ToggleShuffle(this.checked)" />
              隨機排序
            </label>
            <button type="button" onclick="q2Restart()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold cursor-pointer">
              重新開始
            </button>
            <button type="button" onclick="q2RetryWrong()" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 font-bold border border-slate-300 cursor-pointer">
              錯題重測
            </button>
            <button type="button" onclick="q2RevealAll()" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 font-bold border border-slate-300 cursor-pointer">
              顯示全部答案
            </button>
          </div>

          <!-- Stats & Progress -->
          <div class="grid grid-cols-3 gap-3 text-center">
            <div class="bg-white border border-slate-200 rounded-xl p-3 font-bold text-xs sm:text-sm">
              已作答 <span class="text-indigo-700 text-base sm:text-lg">${doneCount}</span> / ${order.length}
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-3 font-bold text-xs sm:text-sm">
              答對 <span class="text-emerald-700 text-base sm:text-lg">${rightCount}</span>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-3 font-bold text-xs sm:text-sm">
              正確率 <span class="text-blue-700 text-base sm:text-lg">${rate}%</span>
            </div>
          </div>

          <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-indigo-600 transition-all duration-300" style="width:${barPct}%"></div>
          </div>

          <!-- Cards -->
          <div class="space-y-3">
            ${order.map((origIdx, dispIdx) => {
              const x = QUIZ2_BANK[origIdx];
              const chosen = ansMap[origIdx];
              const isAnswered = chosen !== undefined;
              const isRight = isAnswered && chosen === x.ans;
              const showExp = isAnswered || state.q2.showAllAnswers;

              return `
                <section class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 space-y-3 shadow-2xs">
                  <div class="flex items-center justify-between text-xs text-slate-500 font-semibold">
                    <span>第 ${dispIdx + 1} 題（題庫 #${origIdx + 1}）</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700">${escapeHtml(x.cat)}</span>
                  </div>
                  <div class="text-base sm:text-[17px] font-bold text-slate-900 whitespace-pre-wrap">${escapeHtml(x.q)}</div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${x.opts.map((opt, j) => {
                      let cls = "w-full text-left px-3.5 py-2.5 rounded-xl border transition flex items-center gap-2 text-sm font-medium ";
                      if (!isAnswered && !state.q2.showAllAnswers) {
                        cls += "bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 text-slate-800 cursor-pointer";
                      } else if (j === x.ans) {
                        cls += "bg-emerald-50 border-emerald-500 text-emerald-950 font-bold cursor-default";
                      } else if (j === chosen) {
                        cls += "bg-rose-50 border-rose-400 text-rose-950 cursor-default";
                      } else {
                        cls += "bg-slate-50 border-slate-200 text-slate-500 cursor-default";
                      }
                      return `
                        <button type="button" ${isAnswered ? "disabled" : ""} onclick="q2Choose(${origIdx}, ${j})" class="${cls}">
                          <span class="w-6 h-6 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs grid place-items-center shrink-0">${letters[j]}</span>
                          <span>${escapeHtml(opt)}</span>
                        </button>
                      `;
                    }).join("")}
                  </div>
                  ${showExp ? `
                    <div class="p-3.5 rounded-xl border-l-4 ${
                      isAnswered
                        ? (isRight ? "bg-emerald-50 border-emerald-600 text-emerald-950" : "bg-rose-50 border-rose-600 text-rose-950")
                        : "bg-indigo-50 border-indigo-600 text-indigo-950"
                    } text-xs sm:text-sm space-y-1">
                      <div class="font-bold">
                        ${isAnswered ? (isRight ? "✓ 答對了！" : "✕ 答錯了！") : "答案提示："}
                        正確答案：${letters[x.ans]}．${escapeHtml(x.opts[x.ans])}
                      </div>
                      <div class="text-slate-700">解析：${escapeHtml(x.exp)}</div>
                    </div>
                  ` : ""}
                </section>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function q2ChangeCat(cat) {
      state.q2.cat = cat;
      rebuildQ2Order();
      renderQ2();
    }

    function q2ToggleShuffle(checked) {
      state.q2.shuffle = checked;
      const currentOrder = state.q2.order || [];
      state.q2.order = checked ? shuffleIndices(currentOrder) : [...currentOrder].sort((a, b) => a - b);
      saveState();
      renderQ2();
    }

    function q2Choose(origIdx, j) {
      if (state.q2.answers[origIdx] !== undefined) return;
      state.q2.answers[origIdx] = j;
      saveState();
      renderQ2();
    }

    function q2Restart() {
      const matching = getQ2FilteredIndices();
      state.q2.order = state.q2.shuffle ? shuffleIndices(matching) : matching;
      state.q2.answers = {};
      state.q2.wrongOnlyView = false;
      state.q2.showAllAnswers = false;
      saveState();
      renderQ2();
    }

    function q2RetryWrong() {
      const wrong = Object.keys(state.q2.answers || {})
        .map(Number)
        .filter((idx) => QUIZ2_BANK[idx] && state.q2.answers[idx] !== QUIZ2_BANK[idx].ans);

      if (!wrong.length) {
        showToast("目前沒有錯題可重測！");
        return;
      }
      const nextAnswers = { ...(state.q2.answers || {}) };
      wrong.forEach((idx) => delete nextAnswers[idx]);
      state.q2.answers = nextAnswers;
      state.q2.order = state.q2.shuffle ? shuffleIndices(wrong) : wrong;
      state.q2.showAllAnswers = false;
      saveState();
      renderQ2();
    }

    function q2RevealAll() {
      state.q2.showAllAnswers = true;
      saveState();
      renderQ2();
    }

    /* -------------------------------------------------------------------------
       7C. QUIZ 3 LOGIC: 優華數位學習 — 國七上康軒版二段成語線上測驗（共200題）
       ------------------------------------------------------------------------- */
    const Q3_PER_PAGE = 10;

    function getQ3Filtered() {
      const r = state.q3.round || "all";
      const t = state.q3.qType || "all";
      const ansMap = state.q3.answers || {};

      return QUIZ3_BANK.filter((item) => {
        const roundNum = Math.ceil(item.id / 25);
        if (r !== "all" && String(roundNum) !== String(r)) return false;
        if (t !== "all" && t !== "wrong_unanswered" && item.type !== t) return false;
        if (t === "wrong_unanswered") {
          const ua = ansMap[item.id];
          const isWrong = ua !== undefined && ua !== item.ans;
          const isUnanswered = ua === undefined;
          return isWrong || isUnanswered;
        }
        return true;
      });
    }

    function renderQ3() {
      const mount = document.getElementById("chinese-quiz-mount");
      if (!mount) return;

      const filtered = getQ3Filtered();
      const totalPages = Math.max(1, Math.ceil(filtered.length / Q3_PER_PAGE));
      if (state.q3.page > totalPages) state.q3.page = totalPages;
      if (state.q3.page < 1) state.q3.page = 1;

      const startIdx = (state.q3.page - 1) * Q3_PER_PAGE;
      const pageItems = filtered.slice(startIdx, startIdx + Q3_PER_PAGE);

      const ansMap = state.q3.answers || {};
      const answeredCount = Object.keys(ansMap).length;
      const correctCount = Object.entries(ansMap).filter(([id, val]) => {
        const qObj = QUIZ3_BANK.find((item) => item.id === Number(id));
        return qObj && Number(val) === qObj.ans;
      }).length;
      const pct = Math.round((answeredCount / QUIZ3_BANK.length) * 100);

      mount.innerHTML = `
        <div class="space-y-4">
          <div class="rounded-2xl bg-gradient-to-r from-[#2c3e50] to-[#3498db] text-white p-5">
            <h4 class="text-xl sm:text-2xl font-extrabold">優華數位學習 — 國七上康軒版二段成語線上測驗（共200題）</h4>
            <p class="text-blue-100 text-xs sm:text-sm mt-1">
              涵蓋文意選填與成語釋義，每題皆附詳細解析，支援回次篩選、題型篩選、錯題重練與進度自動儲存。
            </p>
          </div>

          <!-- Progress & Score Bar -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm font-bold text-slate-700">
              <span>作答進度：${answeredCount} / ${QUIZ3_BANK.length} 題（${pct}%）</span>
              <span>目前答對：${correctCount} 題（已作答正確率：${answeredCount ? Math.round((correctCount / answeredCount) * 100) : 0}%）</span>
            </div>
            <div class="h-2.5 bg-slate-200 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-500 transition-all duration-300" style="width:${pct}%"></div>
            </div>
          </div>

          <!-- Filter Bar -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-wrap gap-2.5 items-center justify-between text-xs sm:text-sm">
            <div class="flex flex-wrap gap-2.5 items-center">
              <select onchange="q3ChangeRound(this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-800 font-semibold">
                <option value="all" ${state.q3.round === "all" ? "selected" : ""}>全部題目（第1～200題）</option>
                ${Array.from({ length: 8 }, (_, idx) => {
                  const rNum = idx + 1;
                  const s = (rNum - 1) * 25 + 1;
                  const e = rNum * 25;
                  return `<option value="${rNum}" ${String(state.q3.round) === String(rNum) ? "selected" : ""}>第 ${rNum} 回（第${s}～${e}題）</option>`;
                }).join("")}
              </select>

              <select onchange="q3ChangeType(this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-800 font-semibold">
                <option value="all" ${state.q3.qType === "all" ? "selected" : ""}>全部題型</option>
                <option value="文意選填" ${state.q3.qType === "文意選填" ? "selected" : ""}>文意選填</option>
                <option value="成語釋義" ${state.q3.qType === "成語釋義" ? "selected" : ""}>成語釋義</option>
                <option value="wrong_unanswered" ${state.q3.qType === "wrong_unanswered" ? "selected" : ""}>僅顯示「答錯 / 未作答」</option>
              </select>
            </div>

            <div class="flex flex-wrap gap-2 items-center">
              <button type="button" onclick="q3TogglePageExp()" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold cursor-pointer">
                ${state.q3.showPageExp ? "收合本頁解析" : "展開本頁解析"}
              </button>
              <button type="button" onclick="q3ResetAll()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold cursor-pointer">
                清除所有作答紀錄
              </button>
            </div>
          </div>

          <!-- Questions Container -->
          <div class="space-y-4">
            ${pageItems.length ? pageItems.map((item) => {
              const userAns = ansMap[item.id];
              const hasAnswered = userAns !== undefined;
              const isCorrect = hasAnswered && userAns === item.ans;
              const showExp = hasAnswered || state.q3.showPageExp;
              const roundNum = Math.ceil(item.id / 25);

              return `
                <article class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 space-y-3 shadow-2xs">
                  <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
                    <span class="px-2.5 py-0.5 rounded-lg bg-slate-800 text-white">第 ${item.id} 題</span>
                    <span class="px-2.5 py-0.5 rounded-lg bg-blue-50 text-blue-700">第 ${roundNum} 回</span>
                    <span class="px-2.5 py-0.5 rounded-lg bg-indigo-50 text-indigo-700">${escapeHtml(item.type)}</span>
                  </div>
                  <div class="text-base sm:text-[17px] font-bold text-slate-900">${escapeHtml(item.q)}</div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${item.opts.map((optStr, idx) => {
                      let cls = "w-full text-left px-3.5 py-2.5 rounded-xl border text-sm font-medium transition ";
                      if (hasAnswered) {
                        if (idx === item.ans) {
                          cls += "bg-emerald-50 border-emerald-500 text-emerald-950 font-bold cursor-default";
                        } else if (idx === userAns && !isCorrect) {
                          cls += "bg-rose-50 border-rose-400 text-rose-950 cursor-default";
                        } else {
                          cls += "bg-slate-50 border-slate-200 text-slate-500 cursor-default";
                        }
                      } else {
                        cls += "bg-white border-slate-200 hover:border-blue-500 hover:bg-blue-50/40 text-slate-800 cursor-pointer";
                      }
                      return `
                        <button type="button" ${hasAnswered ? "disabled" : ""} onclick="q3SelectOption(${item.id}, ${idx})" class="${cls}">
                          ${escapeHtml(optStr)}
                        </button>
                      `;
                    }).join("")}
                  </div>
                  ${showExp ? `
                    <div class="p-3.5 rounded-xl border-l-4 ${
                      hasAnswered
                        ? (isCorrect ? "bg-emerald-50 border-emerald-600 text-emerald-950" : "bg-rose-50 border-rose-600 text-rose-950")
                        : "bg-sky-50 border-sky-600 text-sky-950"
                    } text-xs sm:text-sm space-y-1">
                      <div class="font-bold">
                        ${hasAnswered ? (isCorrect ? "✓ 答對了！" : "✕ 答錯了！") : "解析說明"}
                        （正確答案：${escapeHtml(item.opts[item.ans])}）
                      </div>
                      <div class="text-slate-700">${escapeHtml(item.exp)}</div>
                    </div>
                  ` : ""}
                </article>
              `;
            }).join("") : `
              <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center text-sm text-slate-600">
                目前篩選條件下沒有符合的題目（可能皆已作答且全對）。請切換篩選條件或回到全部題目。
              </div>
            `}
          </div>

          <!-- Pagination -->
          <div class="flex flex-wrap items-center justify-center gap-2 pt-2">
            <button
              type="button"
              ${state.q3.page <= 1 ? "disabled" : ""}
              onclick="q3GoPage(${state.q3.page - 1})"
              class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 font-bold text-xs sm:text-sm disabled:opacity-40 cursor-pointer"
            >
              上一頁
            </button>
            ${Array.from({ length: totalPages }, (_, idx) => idx + 1).map((p) => `
              <button
                type="button"
                onclick="q3GoPage(${p})"
                class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold cursor-pointer ${
                  p === state.q3.page
                    ? "bg-blue-600 text-white"
                    : "bg-white border border-slate-300 text-slate-700 hover:bg-slate-50"
                }"
              >
                ${p}
              </button>
            `).join("")}
            <button
              type="button"
              ${state.q3.page >= totalPages ? "disabled" : ""}
              onclick="q3GoPage(${state.q3.page + 1})"
              class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 font-bold text-xs sm:text-sm disabled:opacity-40 cursor-pointer"
            >
              下一頁
            </button>
          </div>
        </div>
      `;
    }

    function q3ChangeRound(val) {
      state.q3.round = val;
      state.q3.page = 1;
      state.q3.showPageExp = false;
      saveState();
      renderQ3();
    }

    function q3ChangeType(val) {
      state.q3.qType = val;
      state.q3.page = 1;
      state.q3.showPageExp = false;
      saveState();
      renderQ3();
    }

    function q3SelectOption(qid, optIdx) {
      if (state.q3.answers[qid] !== undefined) return;
      state.q3.answers[qid] = optIdx;
      saveState();
      renderQ3();
    }

    function q3TogglePageExp() {
      state.q3.showPageExp = !state.q3.showPageExp;
      saveState();
      renderQ3();
    }

    function q3ResetAll() {
      state.q3.answers = {};
      state.q3.page = 1;
      state.q3.showPageExp = false;
      saveState();
      renderQ3();
      showToast("已清除康軒版成語測驗作答紀錄。");
    }

    function q3GoPage(p) {
      state.q3.page = p;
      state.q3.showPageExp = false;
      saveState();
      renderQ3();
      const mount = document.getElementById("chinese-quiz-mount");
      if (mount) mount.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    /* =========================================================================
       7D. STANDALONE / FULLSCREEN LAUNCHER FOR ANY CHINESE QUIZ
       ========================================================================= */
    function openStandaloneChineseQuiz(quizId) {
      const titleMap = {
        q1: "七上K版國文二段（42題）",
        q2: "七上K版國文二段｜200題線上測驗",
        q3: "優華數位學習 — 國七上康軒版二段成語線上測驗（共200題）"
      };
      const payload = {
        quizId,
        title: titleMap[quizId] || "國文K版測驗",
        q1Bank: QUIZ1_BANK,
        q2Bank: QUIZ2_BANK,
        q3Bank: QUIZ3_BANK,
        stateSnapshot: state
      };

      try {
        const serialized = JSON.stringify(payload)
          .replace(/</g, "\\u003c")
          .replace(/>/g, "\\u003e")
          .replace(/&/g, "\\u0026");

        const htmlDoc = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${escapeHtml(payload.title)} — 獨立測驗視窗</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 sm:p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-lg p-6 sm:p-8 space-y-6">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-4">
      <div>
        <div class="text-xs font-bold text-indigo-600">國中段考刷題區・獨立測驗模式</div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(payload.title)}</h1>
      </div>
      <button type="button" onclick="window.close()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold cursor-pointer">
        關閉視窗
      </button>
    </div>
    <div id="standalone-mount" class="space-y-4"></div>
  </div>
  <script>
    const DATA = ${serialized};
    const mount = document.getElementById("standalone-mount");
    const letters = ["A", "B", "C", "D"];

    if (DATA.quizId === "q1") {
      mount.innerHTML = DATA.q1Bank.map((q, idx) => \`
        <section class="border border-slate-200 rounded-2xl p-4 space-y-2">
          <div class="text-xs font-bold text-indigo-700">第 \${idx + 1} 題・\${q.t}\${q.src ? "（" + q.src + "）" : ""}</div>
          <div class="font-bold text-slate-900">\${q.q}</div>
          <div class="grid gap-1.5 text-sm">
            \${q.o.map((opt, i) => \`<div class="px-3 py-2 rounded-xl \${i === q.a ? "bg-emerald-50 border border-emerald-400 font-bold text-emerald-950" : "bg-slate-50 border border-slate-200"}">\${letters[i]}. \${opt}</div>\`).join("")}
          </div>
          <div class="text-xs text-slate-700 bg-blue-50/70 p-2.5 rounded-xl"><strong>解析：</strong>\${q.e}</div>
        </section>
      \`).join("");
    } else if (DATA.quizId === "q2") {
      mount.innerHTML = DATA.q2Bank.map((q, idx) => \`
        <section class="border border-slate-200 rounded-2xl p-4 space-y-2">
          <div class="text-xs font-bold text-indigo-700">第 \${idx + 1} 題・\${q.cat}</div>
          <div class="font-bold text-slate-900">\${q.q}</div>
          <div class="grid sm:grid-cols-2 gap-1.5 text-sm">
            \${q.opts.map((opt, i) => \`<div class="px-3 py-2 rounded-xl \${i === q.ans ? "bg-emerald-50 border border-emerald-400 font-bold text-emerald-950" : "bg-slate-50 border border-slate-200"}">\${letters[i]}. \${opt}</div>\`).join("")}
          </div>
          <div class="text-xs text-slate-700 bg-blue-50/70 p-2.5 rounded-xl"><strong>解析：</strong>\${q.exp}</div>
        </section>
      \`).join("");
    } else {
      mount.innerHTML = DATA.q3Bank.map((q) => \`
        <section class="border border-slate-200 rounded-2xl p-4 space-y-2">
          <div class="text-xs font-bold text-indigo-700">第 \${q.id} 題・\${q.type}</div>
          <div class="font-bold text-slate-900">\${q.q}</div>
          <div class="grid sm:grid-cols-2 gap-1.5 text-sm">
            \${q.opts.map((opt, i) => \`<div class="px-3 py-2 rounded-xl \${i === q.ans ? "bg-emerald-50 border border-emerald-400 font-bold text-emerald-950" : "bg-slate-50 border border-slate-200"}">\${opt}</div>\`).join("")}
          </div>
          <div class="text-xs text-slate-700 bg-blue-50/70 p-2.5 rounded-xl"><strong>解析：</strong>\${q.exp}</div>
        </section>
      \`).join("");
    }
  <\/script>
</body>
</html>`;

        const blob = new Blob([htmlDoc], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const win = window.open(url, "_blank", "noopener,noreferrer");
        if (!win) {
          showToast("瀏覽器阻擋了彈出視窗，請允許彈出視窗後再試一次。");
        }
        setTimeout(() => URL.revokeObjectURL(url), 15000);
      } catch (err) {
        showToast("無法開啟獨立視窗，請直接使用內嵌測驗模式。");
      }
    }

    /* =========================================================================
       8. 公民H版 MODULE (七上第二次段考・翰林版公民重點與互動練習)
       ========================================================================= */
    function renderCivicsModule() {
      const container = document.getElementById("subject-content-root");
      if (!container) return;

      const topics = ["全部", ...CIVICS_NOTES.map((n) => n.topic)];
      const selectedCat = state.civics.cat || "全部";
      const ansMap = state.civics.answers || {};
      const letters = ["A", "B", "C", "D"];

      const filteredQuestions = CIVICS_QUESTIONS
        .map((item, idx) => ({ ...item, origIdx: idx }))
        .filter((item) => selectedCat === "全部" || item.cat === selectedCat);

      const totalAnswered = Object.keys(ansMap).length;
      const totalCorrect = Object.entries(ansMap).filter(([idx, val]) => {
        const qItem = CIVICS_QUESTIONS[Number(idx)];
        return qItem && Number(val) === qItem.ans;
      }).length;

      container.innerHTML = `
        <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-6 fade-in">
          <!-- Header Banner -->
          <div class="rounded-2xl bg-gradient-to-r from-emerald-800 via-teal-700 to-cyan-700 text-white p-5 sm:p-6">
            <span class="inline-block px-3 py-0.5 rounded-full bg-white/15 border border-white/25 text-xs font-bold">
              七年級上學期・第二次段考・翰林版公民（H版）
            </span>
            <h3 class="text-xl sm:text-2xl font-extrabold mt-2">公民H版：家庭、學校、群體與人際互動</h3>
            <p class="text-emerald-100 text-xs sm:text-sm mt-1">
              整理家庭與婚姻、親子互動、學校規範與班級經營、群體與社會互動、人際溝通與衝突化解五大單元重點與段考練習題。
            </p>
          </div>

          <!-- Score & Topic Filter -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-center bg-slate-50 border border-slate-200 rounded-2xl p-4">
            <div class="flex items-center gap-4 text-xs sm:text-sm font-bold text-slate-700">
              <span>全卷已作答：<strong class="text-emerald-700 text-base">${totalAnswered}</strong> / ${CIVICS_QUESTIONS.length}</span>
              <span>答對：<strong class="text-teal-700 text-base">${totalCorrect}</strong> 題</span>
            </div>
            <div class="flex flex-wrap gap-2 items-center lg:justify-end lg:col-span-2">
              <button
                type="button"
                onclick="civicsToggleNotes()"
                class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border border-slate-300 text-xs sm:text-sm font-bold cursor-pointer"
              >
                ${state.civics.showNotes ? "收合重點整理" : "展開重點整理"}
              </button>
              <button
                type="button"
                onclick="civicsResetAnswers()"
                class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold cursor-pointer"
              >
                重設公民作答
              </button>
            </div>
          </div>

          <!-- Topic Pills -->
          <div class="flex flex-wrap gap-2">
            ${topics.map((t) => {
              const active = selectedCat === t;
              return `
                <button
                  type="button"
                  onclick="civicsSelectCat('${escapeHtml(t)}')"
                  class="px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold transition cursor-pointer ${
                    active
                      ? "bg-emerald-600 text-white shadow-xs"
                      : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                  }"
                >
                  ${escapeHtml(t)}
                </button>
              `;
            }).join("")}
          </div>

          <!-- Study Notes Section -->
          ${state.civics.showNotes ? `
            <div class="space-y-3">
              <h4 class="text-base sm:text-lg font-extrabold text-slate-900">📌 單元重點速記</h4>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${CIVICS_NOTES.filter((n) => selectedCat === "全部" || n.topic === selectedCat).map((note) => `
                  <div class="bg-emerald-50/40 border border-emerald-200/80 rounded-2xl p-4 space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-extrabold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">${escapeHtml(note.badge)}</span>
                      <span class="text-sm font-extrabold text-slate-900">${escapeHtml(note.topic)}</span>
                    </div>
                    <ul class="space-y-1.5 text-xs sm:text-sm text-slate-700 list-disc pl-4">
                      ${note.points.map((pt) => `<li>${escapeHtml(pt)}</li>`).join("")}
                    </ul>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <!-- Interactive Practice Questions -->
          <div class="space-y-3">
            <h4 class="text-base sm:text-lg font-extrabold text-slate-900">✍️ 公民H版互動練習題（${filteredQuestions.length} 題）</h4>
            ${filteredQuestions.map((item, idx) => {
              const chosen = ansMap[item.origIdx];
              const hasAnswered = chosen !== undefined;
              const isRight = hasAnswered && chosen === item.ans;

              return `
                <article class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 space-y-3 shadow-2xs">
                  <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
                    <span>第 ${idx + 1} 題</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-teal-50 text-teal-800 font-bold">${escapeHtml(item.cat)}</span>
                  </div>
                  <div class="text-base sm:text-[17px] font-bold text-slate-900">${escapeHtml(item.q)}</div>
                  <div class="grid gap-2">
                    ${item.opts.map((optText, j) => {
                      let cls = "w-full text-left px-3.5 py-2.5 rounded-xl border text-sm font-medium flex items-center gap-2.5 transition ";
                      if (!hasAnswered) {
                        cls += "bg-white border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/40 text-slate-800 cursor-pointer";
                      } else if (j === item.ans) {
                        cls += "bg-emerald-50 border-emerald-500 text-emerald-950 font-bold cursor-default";
                      } else if (j === chosen) {
                        cls += "bg-rose-50 border-rose-400 text-rose-950 cursor-default";
                      } else {
                        cls += "bg-slate-50 border-slate-200 text-slate-500 cursor-default";
                      }
                      return `
                        <button type="button" ${hasAnswered ? "disabled" : ""} onclick="civicsChoose(${item.origIdx}, ${j})" class="${cls}">
                          <span class="w-6 h-6 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs grid place-items-center shrink-0">${letters[j]}</span>
                          <span>${escapeHtml(optText)}</span>
                        </button>
                      `;
                    }).join("")}
                  </div>
                  ${hasAnswered ? `
                    <div class="p-3.5 rounded-xl border-l-4 ${isRight ? "bg-emerald-50 border-emerald-600 text-emerald-950" : "bg-rose-50 border-rose-600 text-rose-950"} text-xs sm:text-sm space-y-1">
                      <div class="font-bold">
                        ${isRight ? "✓ 答對了！" : "✕ 再想想看！"} 正確答案：${letters[item.ans]}．${escapeHtml(item.opts[item.ans])}
                      </div>
                      <div class="text-slate-700">解析：${escapeHtml(item.exp)}</div>
                    </div>
                  ` : ""}
                </article>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    function civicsSelectCat(cat) {
      state.civics.cat = cat;
      saveState();
      renderCivicsModule();
    }

    function civicsToggleNotes() {
      state.civics.showNotes = !state.civics.showNotes;
      saveState();
      renderCivicsModule();
    }

    function civicsChoose(origIdx, j) {
      if (state.civics.answers[origIdx] !== undefined) return;
      state.civics.answers[origIdx] = j;
      saveState();
      renderCivicsModule();
    }

    function civicsResetAnswers() {
      state.civics.answers = {};
      saveState();
      renderCivicsModule();
      showToast("已重設公民H版作答紀錄。");
    }

    /* =========================================================================
       9. INITIALIZATION
       ========================================================================= */
    window.addEventListener("DOMContentLoaded", () => {
      syncTopNav();
      renderApp();
    });
  </script>
</body>
</html>
