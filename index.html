    const QUIZ1_BANK = [
      {t:"字音字形",q:"下列哪一組「」內的字音相同？",o:["反「璞」歸真／「撲」天蓋地","民窮財「匱」／「潰」不成軍","泥「濘」／叮「嚀」","「荀」子／蘆「筍」"],a:1,e:"「匱」與「潰」都讀ㄎㄨㄟˋ；其餘各組讀音不同。"},
      {t:"字音字形",q:"下列注音寫成國字後，哪一組字形相同？",o:["「ㄆㄨˊ」玉／返「ㄆㄨˊ」歸真","「ㄐㄧㄤ」繩／「ㄐㄧㄤ」硬","潛移「ㄇㄛˋ」化／胸無點「ㄇㄛˋ」","驚鴻一「ㄆㄧㄝ」／「ㄆㄧㄝ」開成見"],a:2,e:"兩處都寫作「墨」：潛移默化應為「默」，胸無點墨為「墨」；本題原卷選項疑有辨字或轉錄差異，請教師核對原卷字形。"},
      {t:"字音字形",q:"「巷弄」中的「弄」在此應讀哪個音？",o:["ㄋㄨㄥˋ","ㄌㄨㄥˋ","ㄌㄨㄥˊ","ㄋㄨㄥˊ"],a:1,e:"「巷弄」指巷子、小巷，讀作ㄌㄨㄥˋ。"},
      {t:"詞語與成語",q:"「明察秋毫」的意思最接近下列何者？",o:["眼力敏銳，能看清極細微的事物","對事情感到十分驚訝","景象繁多而且十分壯觀","做事謹慎，不敢輕易決定"],a:0,e:"「秋毫」指鳥獸在秋天新生的細毛；「明察秋毫」形容觀察力極敏銳。"},
      {t:"詞語與成語",q:"下列哪一個成語適合形容事情結束後，人群逐漸散去的失落？",o:["苦盡甘來","曲終人散","未雨綢繆","見賢思齊"],a:1,e:"「曲終人散」比喻事情結束後，聚集的人各自離去。"},
      {t:"詞語與成語",q:"下列「」中的詞語，何者使用正確？",o:["他聰明靈敏，能「舉一反三」，觸類旁通","既然他已認錯，我們就「當仁不讓」吧","母親從不「未雨綢繆」，總是預先做好準備","那種「巧言令色」的人，表面友善，實則別有用心"],a:3,e:"「巧言令色」指花言巧語、表情和善，常形容以言辭和神色討好別人的人。此題依原卷語意判斷；A也符合「舉一反三」的正確用法，題幹可能存在多解，建議教師核對原卷答案。"},
      {t:"詞語與成語",q:"「安分守己」與「循規蹈矩」的關係，和下列哪一組相同？",o:["鍥而不捨／功虧一簣","敷衍苟且／苟延殘喘","未雨綢繆／防患未然","道聽塗說／說三道四"],a:2,e:"「安分守己」與「循規蹈矩」意思相近；「未雨綢繆」與「防患未然」也都指事先做好準備。"},
      {t:"詞語與成語",q:"下列哪一個詞語的用字完全正確？",o:["耳熟能祥","追本塑源","雨後春荀","溫和蘊藉"],a:3,e:"正確寫法是「溫和蘊藉」；其他應為「耳熟能詳」、「追本溯源」、「雨後春筍」。"},
      {t:"論語與文言文",q:"「學而時習之，不亦說乎？」孔子認為哪一種學習方式能帶來喜悅？",o:["廢寢忘食、不間斷苦讀","學習後時常溫習所學內容","只在考試前集中背誦","只聽老師講解而不練習"],a:1,e:"「時習」是時常溫習；學習後能反覆練習、熟悉所學，便能得到樂趣。"},
      {t:"論語與文言文",q:"「人不知而不慍，不亦君子乎？」主要強調什麼態度？",o:["努力追求名聲與肯定","別人不理解自己時仍不怨恨","凡事都要迎合他人的想法","只和能力比自己好的人交朋友"],a:1,e:"「不知」指別人不了解自己；「不慍」是不怨恨，表現出有修養者不因未獲理解而生氣。"},
      {t:"論語與文言文",q:"「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」最重要的學習態度是什麼？",o:["只向老師學習","選擇別人的優點學習，反省自己的缺點","避免和不同想法的人相處","要求別人改正缺點"],a:1,e:"看到別人的優點就學習，看到別人的缺點就反省自己是否也有，重點在擇善而從、見不善而自省。"},
      {t:"論語與文言文",q:"「己所不欲，勿施於人」的意思是什麼？",o:["自己不喜歡的事，不要加在別人身上","自己想要的東西，應該先給別人","遇到困難時，不要向別人求助","別人做錯事時，應該立刻責備"],a:0,e:"「欲」是想要；自己不願承受的事情，也不要強加給別人，這是推己及人的待人之道。"},
      {t:"論語與文言文",q:"「項為之強」中的「之」是什麼意思？",o:["的","他、它，指代某件事物","往、到","取消句子獨立性"],a:1,e:"此處「之」代指觀看蚊子飛舞這件事；因為看得入神，脖子都僵硬了。"},
      {t:"論語與文言文",q:"「舌一吐而二蟲盡為所吞」中的「為」是什麼意思？",o:["為了","作為","被","替"],a:2,e:"「為所」是被動句式，「二蟲盡為所吞」就是兩隻蟲都被癩蛤蟆吞掉。"},
      {t:"修辭與語文知識",q:"下列哪一句運用了排比修辭？",o:["人生是一條道路，中間有許多分支","夏天到處是蔥蘢的樹木、繽紛的花朵、茂密的草叢","作主是不必請示，作主是能自主，作主是擁有支配權","她披著一身淡淡的夜色開始工作"],a:2,e:"「作主是……」連續使用相似句型，排列三個以上結構相近的語句，形成排比。"},
      {t:"修辭與語文知識",q:"「哥哥最大方了，連這點小錢都要算得一清二楚。」使用了哪一種修辭？",o:["譬喻","倒反","排比","摹寫"],a:1,e:"表面稱哥哥「最大方」，實際卻指出他斤斤計較，語意與真正意思相反，是倒反。"},
      {t:"修辭與語文知識",q:"「這些街道和巷弄才可以經常保有一張清潔的容顏。」主要使用哪種修辭？",o:["擬人","誇飾","設問","對偶"],a:0,e:"街道巷弄被描述成擁有「容顏」的人，將人的特徵賦予事物，是擬人。"},
      {t:"修辭與語文知識",q:"「聽到屋頂上淅淅瀝瀝的雨聲」中的「淅淅瀝瀝」是狀聲詞。下列何者不是形容雨聲的狀聲詞？",o:["滴答","嘩嘩","淅零零","紛紛"],a:3,e:"「紛紛」常形容雨雪繁密飄落的樣子，不是直接模擬聲音的狀聲詞。"},
      {t:"閱讀理解",q:"清道婦的工作「老早就開始了」，作者雖然起得很早，看到她們時工作已開始。可以推論什麼？",o:["作者起床時，她們已完成工作","她們比作者更晚開始工作","她們開始工作的時間比作者起床更早","作者和她們同時起床"],a:2,e:"既然作者起床後看到清掃工作早已開始，便可推知清道婦開始工作的時間更早。"},
      {t:"閱讀理解",q:"「美是需要時間磨出來的」最接近下列哪一句？",o:["有意栽花花不發，無心插柳柳成蔭","山重水複疑無路，柳暗花明又一村","寶劍鋒從磨礪出，梅花香自苦寒來","長江後浪催前浪，一代新人換舊人"],a:2,e:"「寶劍鋒從磨礪出，梅花香自苦寒來」強調經過磨練與時間，才能展現美好成果。"},
      {t:"閱讀理解",q:"閱讀元宵與湯圓的比較：元宵是把餡料放入有糯米粉的竹篩中搖晃，反覆灑水使其成形。這是哪一種製作步驟？",o:["先揉粉糰，再把餡料包入其中","先將餡料沾粉搖滾，再反覆灑水","將糯米粉與餡料加水揉成長條","把成形的湯圓放入竹篩冷藏"],a:1,e:"文章指出元宵以餡料在竹篩中滾動沾附乾糯米粉，過程反覆灑水，逐漸形成圓球。"},
      {t:"閱讀理解",q:"根據元宵與湯圓的文章，兩者最相近的地方是什麼？",o:["內餡材料","製作方式","外皮主要原料","外皮水分含量"],a:2,e:"文章明確指出元宵和湯圓都是糯米製品，因此外皮主要原料相同。"},
      {t:"閱讀理解",q:"文章指出父母將孩子照片上傳網路，可能造成孩子日後難堪。本文主旨最可能是什麼？",o:["父母應教孩子避免所有網路活動","父母公開孩子影像前，應慎重考慮對孩子未來的影響","臉書會使所有家庭關係疏遠","孩子不應使用任何社群平台"],a:1,e:"文章聚焦父母未經孩子意願公開照片，可能造成長期紀錄與同儕嘲笑，因此提醒父母尊重孩子並審慎分享。"},
      {t:"字音字形",q:"下列哪一組「」內的字音相同？",o:["反「璞」歸真／「撲」天蓋地","民窮財「匱」／「潰」不成軍","泥「濘」／叮「嚀」","「荀」子／蘆「筍」"],a:1,e:"「匱」與「潰」都讀ㄎㄨㄟˋ；其餘各組讀音不同。",src:"113學年度林園高中國中部第二次段考"},
      {t:"詞語與成語",q:"下列「」中的詞語替換，何者意思錯誤？",o:["「榜樣」：風範","「容顏」：相貌","「敦厚」：厚實","「從從容容」：不慌不忙"],a:2,e:"「敦厚」主要指待人誠懇厚道；「厚實」多指厚而結實，語意並非完全相同。",src:"113學年度林園高中國中部第二次段考"},
      {t:"詞語與成語",q:"下列文句「」中詞語，何者使用最恰當？",o:["因為他辦事「不利」導致目前情勢對我們十分「不力」，建議趕緊換人處理。","這家餐廳以「無線」暢飲、「無限」上網吸引顧客。","古代朝廷大規模「徵兆」年輕人從軍，多半是戰爭要爆發的「徵召」。","「權力」再大的人，也不能隨意侵犯他人的「權利」。"],a:3,e:"「權力」指職權或支配力量；「權利」指依法享有的利益或資格，兩詞使用正確。",src:"113學年度林園高中國中部第二次段考"},
      {t:"閱讀理解",q:"關於〈差不多先生傳〉的寫作手法，下列敘述何者錯誤？",o:["本文以人物傳記手法寄託作者情志，具有寓言意味。","作者以「圓通大師」肯定差不多先生是智慧圓融、通達事理的人。","以順敘法舉例說明差不多先生從小到大的做事態度。","以「凡事只要差不多就好」為全文主軸，敘述其生平事蹟。"],a:1,e:"「圓通大師」是反諷稱呼，並非真正肯定差不多先生智慧圓融。",src:"113學年度林園高中國中部第二次段考"},
      {t:"詞語與成語",q:"差不多先生把「十字」常寫成「千字」，這種態度造成的結果，最適合用哪一句形容？",o:["失之毫釐，差之千里","愚者千慮，必有一得","人無遠慮，必有近憂","塞翁失馬，焉知非福"],a:0,e:"細微的差錯可能造成極大的結果差異，正是「失之毫釐，差之千里」。",src:"113學年度林園高中國中部第二次段考"},
      {t:"論語與文言文",q:"「學而時習之，不亦說乎？」孔子認為怎樣的學習是喜悅的？",o:["廢寢忘食、不間斷的苦學","進入課程前先自行預習","手腦並用，邊讀書邊習字","學習並且時常溫習學得的內容"],a:3,e:"「時習」是時常溫習、練習所學內容。",src:"113學年度林園高中國中部第二次段考"},

    const QUIZ3_BANK = [{"id": 1, "type": "文意選填", "q": "小明平時不肯下苦功練習書法，到了比賽前夕才臨時抱佛腳，結果寫出來的字體結構鬆散，根本是______，完全無法與得獎作品相比。", "opts": ["(A) 望塵莫及", "(B) 舉一反三", "(C) 溫故知新", "(D) 熟能生巧"], "ans": 0, "exp": "「望塵莫及」指望見前面騎馬的人走過揚起的塵土而不能趕上，比喻遠遠落後。符合題意「完全無法與得獎作品相比」。"}, {"id": 2, "type": "文意選填", "q": "陳老師教學經驗豐富，總能針對不同學生的程度給予最適當的指導，這種______的教育方式讓全班同學都受益良多。", "opts": ["(A) 戶樞不蠹", "(B) 因材施教", "(C) 擇善固執", "(D) 見賢思齊"], "ans": 1, "exp": "「因材施教」指針對學習者的資質、能力與個性，給予不同的教育方式。"}, {"id": 3, "type": "文意選填", "q": "面對網路上真假難辨的謠言，我們應該保持冷靜並多方查證，千萬不可______，隨意跟著網友起舞漫罵。", "opts": ["(A) 人云亦云", "(B) 不恥下問", "(C) 默而識之", "(D) 循循善誘"], "ans": 0, "exp": "「人云亦云」指別人怎麼說，自己就跟著怎麼說，沒有主見。"}, {"id": 4, "type": "文意選填", "q": "雖然他只是個初出茅廬的新人，但工作態度極為謙虛，遇到不懂的專業技術便向資深前輩請教，真正做到了______。", "opts": ["(A) 頤指氣使", "(B) 自以為是", "(C) 不恥下問", "(D) 妄自菲薄"], "ans": 2, "exp": "「不恥下問」指不以向地位或學問比自己低的人請教為可恥，形容虛心求教。"}, {"id": 5, "type": "文意選填", "q": "讀書不能只求死背硬記，更重要的是能夠融會貫通、______，將學到的知識靈活運用在解決生活中的各種問題上。", "opts": ["(A) 學而不厭", "(B) 舉一反三", "(C) 敝帚自珍", "(D) 井底之蛙"], "ans": 1, "exp": "「舉一反三」指從一件事情類推，而能知道其他相關的許多事情。"}, {"id": 6, "type": "文意選填", "q": "射箭選手每天拉弓練習上千次，日積月累下來練就了百步穿楊的絕技，這正是______的最佳寫照。", "opts": ["(A) 唯手熟爾", "(B) 畫蛇添足", "(C) 守株待兔", "(D) 掩耳盜鈴"], "ans": 0, "exp": "「唯手熟爾」出自〈賣油翁〉，指沒有什麼特別的奧祕，只是手藝熟練罷了。"}, {"id": 7, "type": "文意選填", "q": "父母對子女的愛總是______，無論孩子遇到什麼挫折，家永遠是最溫暖的避風港。", "opts": ["(A) 萍水相逢", "(B) 舐犢情深", "(C) 泛泛之交", "(D) 視同陌路"], "ans": 1, "exp": "「舐犢情深」比喻父母對子女深厚的慈愛之情。"}, {"id": 8, "type": "文意選填", "q": "這位雕刻家將平凡無奇的枯木雕琢得栩栩如生，令人不得不佩服他______的精湛技藝。", "opts": ["(A) 巧奪天工", "(B) 粗製濫造", "(C) 千篇一律", "(D) 乏善可陳"], "ans": 0, "exp": "「巧奪天工」指人工的精巧勝過天然，形容技藝極為高超。"}, {"id": 9, "type": "文意選填", "q": "面對旁人的冷嘲熱諷，他依然______地堅持自己的理想，毫不為外界的質疑所動搖。", "opts": ["(A) 見風轉舵", "(B) 隨波逐流", "(C) 擇善固執", "(D) 朝三暮四"], "ans": 2, "exp": "「擇善固執」指選擇正確美好的事物，並堅定地去實踐它。"}, {"id": 10, "type": "文意選填", "q": "爺爺雖然年事已高，但每天依然堅持閱讀報章雜誌並勤做筆記，那股______的精神連年輕人都自嘆不如。", "opts": ["(A) 學而不厭", "(B) 玩物喪志", "(C) 飽食終日", "(D) 游手好閒"], "ans": 0, "exp": "「學而不厭」出自《論語》，指勤奮好學，從不感到厭倦或滿足。"}, {"id": 11, "type": "文意選填", "q": "每當看到同學在課業或才藝上有傑出的表現，我們應該抱持著______的心態向他學習，而不是在背後嫉妒批評。", "opts": ["(A) 妒賢嫉能", "(B) 見賢思齊", "(C) 幸災樂禍", "(D) 落井下石"], "ans": 1, "exp": "「見賢思齊」出自《論語》，指看見有德行或才能的人，就想向他看齊、學習。"}, {"id": 12, "type": "文意選填", "q": "運動能促進新陳代謝、增強免疫力，正所謂「______」，只要每天保持適度的運動習慣，自然能擁有健康的身體。", "opts": ["(A) 戶樞不蠹", "(B) 坐以待斃", "(C) 養尊處優", "(D) 諱疾忌醫"], "ans": 0, "exp": "「戶樞不蠹」指門軸因為經常轉動，所以不會被蟲蛀蝕；比喻常運動或常運用的事物不易衰敗。"}, {"id": 13, "type": "文意選填", "q": "每次段考前，如果能把平時寫錯的題目重新溫習一遍，往往能從中發現新的解題思路，這就是______的道理。", "opts": ["(A) 溫故知新", "(B) 數典忘祖", "(C) 喜新厭舊", "(D) 忘恩負義"], "ans": 0, "exp": "「溫故知新」出自《論語》，指溫習舊有的知識，進而獲得新的體會與理解。"}, {"id": 14, "type": "文意選填", "q": "大家都是這個團隊的一分子，遇到困難時應該______，共同商討對策，而不是各自為政、互相推諉。", "opts": ["(A) 群策群力", "(B) 單打獨鬥", "(C) 袖手旁觀", "(D) 各自為政"], "ans": 0, "exp": "「群策群力」指大家一起出主意，一起出力量，團結合作。"}, {"id": 15, "type": "文意選填", "q": "王教練指導球員時總是______，一步步引導大家修正動作細節，從不輕易對球員大聲咆哮。", "opts": ["(A) 揠苗助長", "(B) 循循善誘", "(C) 暴跳如雷", "(D) 頤指氣使"], "ans": 1, "exp": "「循循善誘」出自《論語》，指依照一定的順序，有步驟地耐心引導別人向學。"}, {"id": 16, "type": "文意選填", "q": "雖然那只是童年時摺的一艘小紙船，但對作者而言卻承載了母親滿滿的關愛，使他至今仍______。", "opts": ["(A) 念念不忘", "(B) 置若罔聞", "(C) 拋諸腦後", "(D) 雲淡風輕"], "ans": 0, "exp": "「念念不忘」形容牢記在心，時刻不忘。"}, {"id": 17, "type": "文意選填", "q": "他不過在比賽中拿了一次冠軍，就變得目中無人、______，完全不把其他參賽者放在眼裡。", "opts": ["(A) 謙沖自牧", "(B) 氣宇軒昂", "(C) 驕矜自滿", "(D) 虛懷若谷"], "ans": 2, "exp": "「驕矜自滿」指驕傲自大，自以為很了不起。"}, {"id": 18, "type": "文意選填", "q": "知識的領域浩瀚無垠，我們千萬不能像______一樣，只看到頭頂上的一小片天空，便以為自己看盡了全世界。", "opts": ["(A) 井底之蛙", "(B) 博古通今", "(C) 學富五車", "(D) 才高八斗"], "ans": 0, "exp": "「井底之蛙」比喻見識狹小、眼界不寬的人。"}, {"id": 19, "type": "文意選填", "q": "做學問最忌諱______，對於一知半解的概念若不徹底弄清楚，日積月累便會成為學習上的絆腳石。", "opts": ["(A) 實事求是", "(B) 追根究底", "(C) 不求甚解", "(D) 精益求精"], "ans": 2, "exp": "「不求甚解」後多指學習不深入、只求表面理解而馬虎了事。"}, {"id": 20, "type": "文意選填", "q": "只要你有心向學，無論什麼時候開始都不嫌晚，千萬不要總是______，認為自己資質平庸而放棄努力。", "opts": ["(A) 妄自菲薄", "(B) 剛愎自用", "(C) 趾高氣揚", "(D) 不可一世"], "ans": 0, "exp": "「妄自菲薄」指過分看輕自己，缺乏自信。"}, {"id": 21, "type": "文意選填", "q": "爸爸每天下班後雖然疲憊不堪，但只要看到孩子天真可愛的笑容，所有的辛勞彷彿都______了。", "opts": ["(A) 煙消雲散", "(B) 捲土重來", "(C) 排山倒海", "(D) 接踵而至"], "ans": 0, "exp": "「煙消雲散」比喻事物或情緒消失殆盡，無影無蹤。"}, {"id": 22, "type": "文意選填", "q": "學習任何樂器都需要長時間的苦練，不可能在短時間內______，必須按部就班才能奏出動人的樂章。", "opts": ["(A) 一蹴可幾", "(B) 循序漸進", "(C) 水到渠成", "(D) 滴水穿石"], "ans": 0, "exp": "「一蹴可幾」比喻事情輕而易舉，很快就能成功。"}, {"id": 23, "type": "文意選填", "q": "看到災區民眾流離失所的慘況，社會各界紛紛伸出援手、慷慨解囊，展現了______的溫暖情懷。", "opts": ["(A) 民胞物與", "(B) 隔岸觀火", "(C) 麻木不仁", "(D) 莫不關心"], "ans": 0, "exp": "「民胞物與」指視天下人為同胞，視萬物為同類，形容博愛精神。"}, {"id": 24, "type": "文意選填", "q": "許多古老的民間工藝因為缺乏年輕一代的傳承，如今已面臨______的危機，亟需政府與民間共同搶救。", "opts": ["(A) 後繼無人", "(B) 人才輩出", "(C) 薪火相傳", "(D) 青出於藍"], "ans": 0, "exp": "「後繼無人」指沒有後人來繼承前人的事業或技藝。"}, {"id": 25, "type": "文意選填", "q": "我們在做決定之前應該______，仔細評估各種可能發生的後果，才不會因為一時衝動而鑄成大錯。", "opts": ["(A) 三思而行", "(B) 輕舉妄動", "(C) 魯莽行事", "(D) 率爾操觚"], "ans": 0, "exp": "「三思而行」指經過反覆謹慎的思考之後再付諸行動。"}, {"id": 26, "type": "成語釋義", "q": "「不恥下問」的意思最接近下列何者？", "opts": ["(A) 不以向地位或學問比自己低的人請教為可恥", "(B) 不敢向老師提出自己心中的疑問", "(C) 認為問問題是一件非常丟臉的事情", "(D) 喜歡在別人面前炫耀自己的學問"], "ans": 0, "exp": "出自《論語．公冶長》：「敏而好學，不恥下問。」指虛心向學問或地位不如自己的人請教。"}, {"id": 27, "type": "成語釋義", "q": "「溫故知新」的意思最接近下列何者？", "opts": ["(A) 喜新厭舊，不願意回顧過去的歷史", "(B) 溫習舊有的知識，進而獲得新的體會與理解", "(C) 只要學習新的知識，舊的知識就可以完全忘記", "(D) 每天都在重複做一模一樣的事情"], "ans": 1, "exp": "出自《論語．為政》：「溫故而知新，可以為師矣。」"}, {"id": 28, "type": "成語釋義", "q": "「舉一反三」的意思最接近下列何者？", "opts": ["(A) 舉起一隻手，反對三件事情", "(B) 每次做事都半途而廢，沒有一次成功", "(C) 從一件事情類推，而能知道其他相關的許多事情", "(D) 說話反反覆覆，讓人不知道該相信哪一句"], "ans": 2, "exp": "出自《論語．述而》：「舉一隅不以三隅反，則不復也。」比喻善於類推、觸類旁通。"}, {"id": 29, "type": "成語釋義", "q": "「擇善固執」的意思最接近下列何者？", "opts": ["(A) 固執己見，完全聽不進別人的好建議", "(B) 選擇正確美好的事物，並堅定地去實踐它", "(C) 隨便選擇一個目標，遇到困難就立刻放棄", "(D) 只挑對自己有利的事情去做"], "ans": 1, "exp": "出自《禮記．中庸》：「誠之者，擇善而固執之者也。」"}, {"id": 30, "type": "成語釋義", "q": "「人云亦云」的意思最接近下列何者？", "opts": ["(A) 別人怎麼說，自己就跟著怎麼說，沒有主見", "(B) 說話很有條理，能夠說服所有人", "(C) 天上的白雲變幻莫測，令人目不暇給", "(D) 喜歡在背後說別人的壞話"], "ans": 0, "exp": "「云」是「說」的意思，指沒有獨立見解，只會盲從附和。"}, {"id": 31, "type": "成語釋義", "q": "「學而不厭」的意思最接近下列何者？", "opts": ["(A) 非常討厭讀書與學習新事物", "(B) 勤奮好學，從不感到厭倦或滿足", "(C) 學習的內容太過枯燥，讓人想睡覺", "(D) 雖然討厭上學，但還是勉強去學校"], "ans": 1, "exp": "出自《論語．述而》：「學而不厭，誨人不倦。」這裡的「厭」作「滿足、厭倦」解。"}, {"id": 32, "type": "成語釋義", "q": "「誨人不倦」的意思最接近下列何者？", "opts": ["(A) 教導學生時非常有耐心，不知疲倦", "(B) 每天都在責罵學生，讓學生感到非常疲倦", "(C) 教書教到一半就覺得累了，想要休息", "(D) 對學生的問題總是不耐煩地敷衍了事"], "ans": 0, "exp": "「誨」是教導的意思，形容教育者極具熱忱與耐心。"}, {"id": 33, "type": "成語釋義", "q": "「因材施教」的意思最接近下列何者？", "opts": ["(A) 根據木材的種類來決定建築的風格", "(B) 針對學習者的資質、能力與個性，給予不同的教育方式", "(C) 所有學生都必須接受完全相同的嚴格訓練", "(D) 只願意教導資質聰明的學生"], "ans": 1, "exp": "「材」指資質、才能，指依據受教者的不同特質進行指導。"}, {"id": 34, "type": "成語釋義", "q": "「見賢思齊」的意思最接近下列何者？", "opts": ["(A) 看見有德行或才能的人，就想向他看齊、學習", "(B) 看見別人比自己優秀，心裡就感到非常嫉妒", "(C) 大家一起排隊站好，把隊伍整理整齊", "(D) 只喜歡和成績好的人做朋友"], "ans": 0, "exp": "出自《論語．里仁》：「見賢思齊焉，見不賢而內自省也。」"}, {"id": 35, "type": "成語釋義", "q": "「戶樞不蠹」的意思最接近下列何者？", "opts": ["(A) 門軸因為經常轉動，所以不會被蟲蛀蝕；比喻常運動或常運用的事物不易衰敗", "(B) 木頭做的門很容易被白蟻蛀壞，需要經常更換", "(C) 整天關在家裡不出門，就能避免受到外界的傷害", "(D) 門鎖生鏽了，必須趕快找人來修理"], "ans": 0, "exp": "「戶樞」指門軸，「蠹」指蛀蟲。常與「流水不腐」連用。"}, {"id": 36, "type": "成語釋義", "q": "「唯手熟爾」的意思最接近下列何者？", "opts": ["(A) 只有雙手是熟的，其他部位都還是生的", "(B) 沒有什麼特別的奧祕，只是手藝熟練罷了", "(C) 雙手非常靈巧，天生就比別人聰明", "(D) 因為手部受傷，所以無法繼續工作"], "ans": 1, "exp": "出自歐陽脩〈賣油翁〉，「唯」作「只、不過」解，「爾」為語助詞「罷了」。"}, {"id": 37, "type": "成語釋義", "q": "「自矜」在〈賣油翁〉一文中的意思最接近下列何者？", "opts": ["(A) 自我檢討，反省自己的過錯", "(B) 自誇、自負，炫耀自己的本領", "(C) 自我安慰，覺得失敗也沒關係", "(D) 非常謙虛，不敢接受別人的讚美"], "ans": 1, "exp": "出自〈賣油翁〉：「汝亦知射乎？吾射不亦精乎？」陳堯咨「以此自矜」，即以此自誇。"}, {"id": 38, "type": "成語釋義", "q": "「忿然」的意思最接近下列何者？", "opts": ["(A) 非常開心的樣子", "(B) 氣憤、生氣的樣子", "(C) 感到困惑不解的樣子", "(D) 傷心流淚的樣子"], "ans": 1, "exp": "「忿」同「憤」，「然」為詞尾「……的樣子」。"}, {"id": 39, "type": "成語釋義", "q": "「睨之」的意思最接近下列何者？", "opts": ["(A) 睜大眼睛仔細地欣賞", "(B) 斜著眼睛看，帶有輕視或不以為然的意味", "(C) 閉上眼睛休息，不願意去看", "(D) 含著淚水深情地凝望"], "ans": 1, "exp": "「睨」音ㄋㄧˋ，斜視的意思，傳神刻畫出賣油翁對陳堯咨射箭技術不以為然的神態。"}, {"id": 40, "type": "成語釋義", "q": "「釋擔而立」的意思最接近下列何者？", "opts": ["(A) 放下擔子站在一旁", "(B) 挑起擔子快速奔跑", "(C) 丟掉擔子轉身離開", "(D) 坐在擔子上面休息"], "ans": 0, "exp": "「釋」為放下之意，「擔」音ㄉㄢˋ，指挑在肩上的重物。"}, {"id": 41, "type": "成語釋義", "q": "「循循善誘」的意思最接近下列何者？", "opts": ["(A) 擅長用花言巧語欺騙別人", "(B) 依照一定的順序，有步驟地耐心引導別人向學", "(C) 每天都在原地繞圈圈，找不到出口", "(D) 強迫別人接受自己的想法"], "ans": 1, "exp": "出自《論語．子罕》：「夫子循循然善誘人」，形容善於引導教育。"}, {"id": 42, "type": "成語釋義", "q": "「舐犢情深」的意思最接近下列何者？", "opts": ["(A) 比喻父母對子女深厚的慈愛之情", "(B) 形容老牛與小牛在草原上奔跑的樣子", "(C) 比喻兄弟姊妹之間感情非常融洽", "(D) 形容師生之間深厚的情誼"], "ans": 0, "exp": "「舐」音ㄕˋ，舔的意思；「犢」音ㄉㄨˊ，小牛。原指老牛舔小牛，後比喻父母愛護子女。"}, {"id": 43, "type": "成語釋義", "q": "「妄自菲薄」的意思最接近下列何者？", "opts": ["(A) 過分看輕自己，缺乏自信", "(B) 過分高估自己的能力，目中無人", "(C) 隨意批評別人的缺點", "(D) 做事非常謹慎，不敢有任何疏忽"], "ans": 0, "exp": "出自諸葛亮〈出師表〉，「菲薄」音ㄈㄟˇ ㄅㄛˊ，輕視、看不起的意思。"}, {"id": 44, "type": "成語釋義", "q": "「不求甚解」的意思最接近下列何者？", "opts": ["(A) 讀書只求領會大意，不穿鑿附會（後多指學習不深入、馬虎了事）", "(B) 遇到不懂的問題一定要打破砂鍋問到底", "(C) 完全不想理解課文在寫什麼", "(D) 學習態度非常嚴謹，每個字都要查字典"], "ans": 0, "exp": "出自陶淵明〈五柳先生傳〉，原為正面讀書態度，現多用來指學習膚淺不求深入。"}, {"id": 45, "type": "成語釋義", "q": "「一蹴可幾」的意思最接近下列何者？", "opts": ["(A) 踏出一步就可以到達；比喻事情輕而易舉，很快就能成功", "(B) 只要踢一腳就能把球踢進球門", "(C) 事情非常困難，一輩子都不可能達成", "(D) 走路不小心跌倒，差點受傷"], "ans": 0, "exp": "「蹴」音ㄘㄨˋ，踏；「幾」音ㄐㄧ，接近、達到。"}, {"id": 46, "type": "成語釋義", "q": "「三思而行」的意思最接近下列何者？", "opts": ["(A) 經過反覆謹慎的思考之後再付諸行動", "(B) 想了三次還是決定放棄不做", "(C) 只要思考三秒鐘就可以立刻行動", "(D) 三個人一起討論後再分頭行動"], "ans": 0, "exp": "出自《論語．公冶長》：「季文子三思而後行。」"}, {"id": 47, "type": "成語釋義", "q": "「默而識之」的意思最接近下列何者？", "opts": ["(A) 默默地把所學的知識記在心裡", "(B) 假裝不認識眼前的朋友", "(C) 保持沉默，一句話也不肯說", "(D) 默默地把別人的缺點記錄下來"], "ans": 0, "exp": "出自《論語．述而》，「識」在此音ㄓˋ，通「誌」，記住的意思。"}, {"id": 48, "type": "成語釋義", "q": "「泛泛之交」的意思最接近下列何者？", "opts": ["(A) 交情非常深厚、可以生死與共的朋友", "(B) 交情很淺、僅止於表面應酬的一般朋友", "(C) 在船上認識的朋友", "(D) 從小一起長大的青梅竹馬"], "ans": 1, "exp": "「泛泛」指普通、一般，形容交情不深。"}, {"id": 49, "type": "成語釋義", "q": "「巧奪天工」的意思最接近下列何者？", "opts": ["(A) 人工的精巧勝過天然，形容技藝極為高超", "(B) 巧妙地把別人的作品搶過來據為己有", "(C) 大自然的風景非常壯麗，人類完全無法模仿", "(D) 工人的動作非常迅速，很快就完工了"], "ans": 0, "exp": "注意：「巧奪天工」只能用來形容「人工」製品，不能用來形容天然風景！"}, {"id": 50, "type": "成語釋義", "q": "「煙消雲散」的意思最接近下列何者？", "opts": ["(A) 像煙雲一樣消散得無影無蹤；比喻事物或情緒消失殆盡", "(B) 天空烏雲密布，眼看就要下起大雨了", "(C) 工廠排放大量黑煙，造成嚴重的空氣汙染", "(D) 燃放煙火時，天空出現五彩繽紛的雲朵"], "ans": 0, "exp": "常用於形容疑慮、煩惱或疲憊感完全消失。"}, {"id": 51, "type": "文意選填", "q": "爺爺總是教導我們做人要飲水思源，千萬不可忘記祖先的恩德與歷史根源，做出______的行為。", "opts": ["(A) 數典忘祖", "(B) 敬業樂群", "(C) 慎終追遠", "(D) 飲水思源"], "ans": 0, "exp": "「數典忘祖」比喻忘本，忘記自己的根源或祖先的恩德。"}, {"id": 52, "type": "文意選填", "q": "這位科學家為了研發新藥，在實驗室裡______地工作了十幾年，終於成功造福了無數病患。", "opts": ["(A) 廢寢忘食", "(B) 飽食終日", "(C) 游手好閒", "(D) 得過且過"], "ans": 0, "exp": "「廢寢忘食」形容專心致志、勤奮努力，連睡覺和吃飯都忘了。"}, {"id": 53, "type": "文意選填", "q": "哥哥每次寫作文都喜歡堆砌華麗卻空洞的詞藻，整篇文章看起來______，完全無法感動讀者。", "opts": ["(A) 言簡意賅", "(B) 華而不實", "(C) 擲地有聲", "(D) 字字珠璣"], "ans": 1, "exp": "「華而不實」指外表華麗，內部卻空虛不切實際。"}, {"id": 54, "type": "文意選填", "q": "雖然這道數學題看起來非常複雜，但只要掌握住核心公式，就能______，輕鬆算出正確答案。", "opts": ["(A) 迎刃而解", "(B) 束手無策", "(C) 進退兩難", "(D) 焦頭爛額"], "ans": 0, "exp": "「迎刃而解」比喻問題很容易就能獲得解決。"}, {"id": 55, "type": "文意選填", "q": "小華平時不努力讀書，考前才想靠作弊過關，這種自欺欺人的做法簡直是______，遲早會被老師發現。", "opts": ["(A) 掩耳盜鈴", "(B) 實事求是", "(C) 光明磊落", "(D) 腳踏實地"], "ans": 0, "exp": "「掩耳盜鈴」比喻自己欺騙自己，以為別人不知道。"}, {"id": 56, "type": "文意選填", "q": "藝術家的創作靈感往往來自日常生活中的細微觀察，只要用心體會，平凡的事物也能化為______的佳作。", "opts": ["(A) 膾炙人口", "(B) 乏味可陳", "(C) 粗製濫造", "(D) 不堪入目"], "ans": 0, "exp": "「膾炙人口」比喻詩文或事物受人歡迎、廣為流傳。"}, {"id": 57, "type": "文意選填", "q": "面對突如其來的地震，消防隊員依然保持冷靜，______地指揮民眾往空曠處疏散，展現了極高的專業素養。", "opts": ["(A) 臨危不亂", "(B) 驚慌失措", "(C) 手忙腳亂", "(D) 心驚膽戰"], "ans": 0, "exp": "「臨危不亂」指遇到危險或緊急情況時，依然保持鎮定、不慌亂。"}, {"id": 58, "type": "文意選填", "q": "他在演講比賽中口若懸河、______，精闢的見解贏得了全場評審與觀眾如雷的掌聲。", "opts": ["(A) 滔滔不絕", "(B) 期期艾艾", "(C) 吞吞吐吐", "(D) 沉默寡言"], "ans": 0, "exp": "「滔滔不絕」形容說話連續不斷，口才極佳。"}, {"id": 59, "type": "文意選填", "q": "這兩幅畫作雖然出自不同畫家之手，但構圖與用色幾乎一模一樣，簡直到了______的地步。", "opts": ["(A) 維妙維肖", "(B) 南轅北轍", "(C) 天壤之別", "(D) 迥然不同"], "ans": 0, "exp": "「維妙維肖」形容描寫或模仿得非常逼真、生動。"}, {"id": 60, "type": "文意選填", "q": "父母為了養育我們付出了無數心血，我們長大後一定要好好孝順他們，切莫等到______時才後悔莫及。", "opts": ["(A) 子欲養而親不待", "(B) 承歡膝下", "(C) 晨昏定省", "(D) 反哺之私"], "ans": 0, "exp": "「子欲養而親不待」感嘆行孝要及時，莫等父母不在世時才後悔。"}, {"id": 61, "type": "文意選填", "q": "這座百年古蹟在經過專家精心的修復後，終於重新展現出當年______的宏偉氣勢。", "opts": ["(A) 富麗堂皇", "(B) 家徒四壁", "(C) 斷垣殘壁", "(D) 蓬門蓽戶"], "ans": 0, "exp": "「富麗堂皇」形容建築物宏偉壯麗，氣派非凡。"}, {"id": 62, "type": "文意選填", "q": "我們在與人交談時應該態度誠懇、言行一致，如果總是______，很快就會失去朋友的信任。", "opts": ["(A) 口是心非", "(B) 言行一致", "(C) 表裡如一", "(D) 推心置腹"], "ans": 0, "exp": "「口是心非」指嘴上說的和心裡想的完全不一致，形容虛偽。"}, {"id": 63, "type": "文意選填", "q": "為了準備下個月的校際辯論賽，隊員們每天放學後都留在教室裡______，反覆演練各種攻防策略。", "opts": ["(A) 集思廣益", "(B) 閉門造車", "(C) 孤軍奮戰", "(D) 各自為政"], "ans": 0, "exp": "「集思廣益」指集合眾人的智慧，廣泛吸收有益的意見。"}, {"id": 64, "type": "文意選填", "q": "他雖然家境清寒，卻從不怨天尤人，反而比別人更加倍努力，這種______的精神令人十分敬佩。", "opts": ["(A) 奮發圖強", "(B) 自暴自棄", "(C) 怨天尤人", "(D) 畫地自限"], "ans": 0, "exp": "「奮發圖強」指振作精神，努力謀求進步與強盛。"}, {"id": 65, "type": "文意選填", "q": "老師再三叮嚀我們，寫考卷時一定要看清楚題目要求，千萬不要因為______而丟了不該丟的分數。", "opts": ["(A) 粗心大意", "(B) 謹小慎微", "(C) 鉅細靡遺", "(D) 一絲不苟"], "ans": 0, "exp": "「粗心大意」指做事馬虎不細心，其餘三項皆為「非常細心」之意。"}, {"id": 66, "type": "文意選填", "q": "這部電影的劇情緊湊、毫無冷場，從頭到尾都讓觀眾看得______，直到字幕升起仍意猶未盡。", "opts": ["(A) 目不轉睛", "(B) 索然無味", "(C) 昏昏欲睡", "(D) 心不在焉"], "ans": 0, "exp": "「目不轉睛」形容注意力非常集中，眼睛一動也不動地盯著看。"}, {"id": 67, "type": "文意選填", "q": "既然已經答應了別人的事情，就應該想辦法全力以赴去完成，怎麼可以______，隨便找藉口推託呢？", "opts": ["(A) 食言而肥", "(B) 一諾千金", "(C) 言出必行", "(D) 信守承諾"], "ans": 0, "exp": "「食言而肥」指說話不算話、不守信用。"}, {"id": 68, "type": "文意選填", "q": "面對朋友的無心之過，我們應該多一分包容與體諒，不要總是______，為了一點小事就大發雷霆。", "opts": ["(A) 斤斤計較", "(B) 寬宏大量", "(C) 宰相肚裡能撐船", "(D) 休休有容"], "ans": 0, "exp": "「斤斤計較」指對微小的得失或無關緊要的小事過分計較。"}, {"id": 69, "type": "文意選填", "q": "經過長達數月的激烈競爭，這支球隊終於憑藉著絕佳的團隊默契______，奪得本屆聯賽的總冠軍。", "opts": ["(A) 脫穎而出", "(B) 名落孫山", "(C) 敬陪末座", "(D) 一敗塗地"], "ans": 0, "exp": "「脫穎而出」比喻人的才能全部顯示出來，超越眾人。"}, {"id": 70, "type": "文意選填", "q": "許多人總喜歡把「明天再開始努力」掛在嘴邊，結果一天拖過一天，最後只能______，一事無成。", "opts": ["(A) 蹉跎歲月", "(B) 惜時如金", "(C) 分秒必爭", "(D) 只爭朝夕"], "ans": 0, "exp": "「蹉跎歲月」指虛度光陰，任由時間白白流逝而毫無作為。"}, {"id": 71, "type": "文意選填", "q": "這位老工匠一輩子只專注於製作手工木梳，每把梳子都經過數十道工序打磨，真正做到了______。", "opts": ["(A) 精益求精", "(B) 敷衍了事", "(C) 馬馬虎虎", "(D) 得過且過"], "ans": 0, "exp": "「精益求精」指已經很好了，還要追求更加完美。"}, {"id": 72, "type": "文意選填", "q": "在這場激烈的辯論會上，正反雙方你來我往、______，各自提出有力的證據來反駁對方的觀點。", "opts": ["(A) 針鋒相對", "(B) 異口同聲", "(C) 不謀而合", "(D) 隨聲附和"], "ans": 0, "exp": "「針鋒相對」比喻雙方在言論、行動上尖銳對立，互不相讓。"}, {"id": 73, "type": "文意選填", "q": "小美對繪畫有著濃厚的興趣，只要一拿起畫筆就會完全沉浸在色彩的世界裡，達到______的境界。", "opts": ["(A) 廢寢忘食", "(B) 漫不經心", "(C) 三心二意", "(D) 朝秦暮楚"], "ans": 0, "exp": "「廢寢忘食」形容專心致志到連睡覺吃飯都忘記的程度。"}, {"id": 74, "type": "文意選填", "q": "我們做任何事情都應該腳踏實地，一步一個腳印往前邁進，千萬不要總想著______，走捷徑投機取巧。", "opts": ["(A) 一步登天", "(B) 按部就班", "(C) 循序漸進", "(D) 穩紮穩打"], "ans": 0, "exp": "「一步登天」比喻不經過努力就突然達到極高的境界或地位。"}, {"id": 75, "type": "文意選填", "q": "雖然兩人在個性上有些差異，但因為有著共同的興趣與價值觀，相處起來依然______，成為無話不談的摯友。", "opts": ["(A) 水乳交融", "(B) 格格不入", "(C) 冰炭不容", "(D) 勢不兩立"], "ans": 0, "exp": "「水乳交融」比喻感情或關係非常融洽契合。"}, {"id": 76, "type": "成語釋義", "q": "「數典忘祖」的意思最接近下列何者？", "opts": ["(A) 忘記祖先的典故與根源；比喻忘本", "(B) 每天都在數家裡有多少本古書", "(C) 非常尊敬祖先，每年都按時祭拜", "(D) 專門研究歷史典籍的學者"], "ans": 0, "exp": "「數」音ㄕㄨˇ，列舉；比喻忘掉自己本來的面目或根源。"}, {"id": 77, "type": "成語釋義", "q": "「廢寢忘食」的意思最接近下列何者？", "opts": ["(A) 連睡覺和吃飯都忘記了；形容專心致志、勤奮努力", "(B) 因為生病而吃不下飯、睡不著覺", "(C) 每天都在睡覺和吃飯，什麼事也不做", "(D) 覺得食物不好吃，所以決定不吃飯"], "ans": 0, "exp": "「寢」指睡覺，「食」指吃飯，形容全心投入工作或學習。"}, {"id": 78, "type": "成語釋義", "q": "「華而不實」的意思最接近下列何者？", "opts": ["(A) 外表看起來很華麗，內部卻很空虛、不切實際", "(B) 植物只會開花，永遠不會結果實", "(C) 非常樸實無華，不喜歡追求流行", "(D) 內容非常充實，文筆也很優美"], "ans": 0, "exp": "原指花開得好看卻不結果實，後比喻人或文章空有外表而無內涵。"}, {"id": 79, "type": "成語釋義", "q": "「迎刃而解」的意思最接近下列何者？", "opts": ["(A) 刀子非常鋒利，可以輕易切開任何東西", "(B) 比喻問題很容易就能獲得解決", "(C) 拿著刀子迎向敵人，勇敢地戰鬥", "(D) 遇到困難時不知道該如何解決"], "ans": 1, "exp": "原指劈竹子時，劈開頭幾節後，後面的竹節就會順著刀刃裂開。"}, {"id": 80, "type": "成語釋義", "q": "「掩耳盜鈴」的意思最接近下列何者？", "opts": ["(A) 摀住自己的耳朵去偷鈴鐺；比喻自己欺騙自己", "(B) 因為聲音太大，所以把耳朵摀起來", "(C) 偷偷摸摸地把別人的鈴鐺藏起來", "(D) 聽力不好，需要戴助聽器才能聽見聲音"], "ans": 0, "exp": "出自《呂氏春秋》，比喻愚蠢地自欺欺人。"}, {"id": 81, "type": "成語釋義", "q": "「膾炙人口」的意思最接近下列何者？", "opts": ["(A) 切細的生肉和烤肉都很美味；比喻詩文或事物受人歡迎、廣為流傳", "(B) 非常喜歡吃烤肉，每天都要吃一頓", "(C) 說話像吃東西一樣含糊不清", "(D) 廚師的手藝很差，做出來的菜沒人敢吃"], "ans": 0, "exp": "「膾」音ㄎㄨㄞˋ，細切的肉；「炙」音ㄓˋ，烤肉。人人愛吃，比喻作品受歡迎。"}, {"id": 82, "type": "成語釋義", "q": "「臨危不亂」的意思最接近下列何者？", "opts": ["(A) 遇到危險或緊急情況時，依然保持鎮定、不慌亂", "(B) 看到危險就嚇得拔腿就跑", "(C) 喜歡到危險的地方去冒險", "(D) 遇到一點小事就緊張得不知所措"], "ans": 0, "exp": "「臨」指面對、遇到，形容沉著冷靜的處事態度。"}, {"id": 83, "type": "成語釋義", "q": "「滔滔不絕」的意思最接近下列何者？", "opts": ["(A) 形容說話連續不斷，口才極佳", "(B) 河水氾濫成災，沖毀了兩岸的房屋", "(C) 說話結結巴巴，半天講不出一句完整的話", "(D) 非常安靜，一句話也不說"], "ans": 0, "exp": "原形容大水滾滾流淌不絕，後多用來形容口才好、說話流暢不斷。"}, {"id": 84, "type": "成語釋義", "q": "「維妙維肖」的意思最接近下列何者？", "opts": ["(A) 形容描寫或模仿得非常逼真、生動", "(B) 畫面非常模糊，完全看不出畫的是什麼", "(C) 兩個人長得完全不像，沒有任何共同點", "(D) 態度非常傲慢，看不起別人"], "ans": 0, "exp": "「肖」音ㄒㄧㄠˋ，相似的意思，形容藝術表現或模仿極為逼真。"}, {"id": 85, "type": "成語釋義", "q": "「子欲養而親不待」的意思最接近下列何者？", "opts": ["(A) 子女想要奉養父母時，父母卻已經過世了；感嘆行孝要及時", "(B) 父母不願意接受子女的奉養", "(C) 子女不肯孝順父母，讓父母非常傷心", "(D) 父母每天都在等待子女回家吃飯"], "ans": 0, "exp": "出自《韓詩外傳》：「樹欲靜而風不止，子欲養而親不待。」"}, {"id": 86, "type": "成語釋義", "q": "「富麗堂皇」的意思最接近下列何者？", "opts": ["(A) 形容建築物宏偉壯麗，氣派非凡", "(B) 家裡非常貧窮，連牆壁都倒塌了", "(C) 皇帝居住的宮殿非常狹小簡陋", "(D) 穿著打扮非常樸素簡單"], "ans": 0, "exp": "「堂皇」形容氣勢盛大宏偉。"}, {"id": 87, "type": "成語釋義", "q": "「口是心非」的意思最接近下列何者？", "opts": ["(A) 嘴上說的和心裡想的完全不一致；形容人虛偽不誠實", "(B) 說話非常直率，心裡想什麼就說什麼", "(C) 嘴巴說錯話，心裡感到非常後悔", "(D) 總是喜歡批評別人的不是"], "ans": 0, "exp": "「是」作「對、同意」解，「非」作「反對、不認同」解。"}, {"id": 88, "type": "成語釋義", "q": "「集思廣益」的意思最接近下列何者？", "opts": ["(A) 集合眾人的智慧，廣泛吸收有益的意見", "(B) 一個人關在房間裡苦思冥想", "(C) 只聽從少數幾個人的意見，不理會其他人", "(D) 大家意見不合，吵得不可開交"], "ans": 0, "exp": "出自諸葛亮〈教與軍師長史參軍掾屬〉，強調團隊腦力激盪的重要性。"}, {"id": 89, "type": "成語釋義", "q": "「奮發圖強」的意思最接近下列何者？", "opts": ["(A) 振作精神，努力謀求進步與強盛", "(B) 遇到挫折就灰心喪志，再也不想努力", "(C) 每天都在發脾氣，讓人不敢靠近", "(D) 隨便畫一張圖來敷衍老師"], "ans": 0, "exp": "「圖」指謀求，形容不甘落後、積極進取。"}, {"id": 90, "type": "成語釋義", "q": "「目不轉睛」的意思最接近下列何者？", "opts": ["(A) 眼珠子一動也不動地盯著看；形容注意力非常集中", "(B) 眼睛受傷了，無法自由轉動", "(C) 東張西望，無法專心看黑板", "(D) 覺得無聊而閉上眼睛睡覺"], "ans": 0, "exp": "「睛」指眼珠，形容看得非常專注。"}, {"id": 91, "type": "成語釋義", "q": "「食言而肥」的意思最接近下列何者？", "opts": ["(A) 說話不算話、不守信用，就像把說出去的話又吞回去一樣", "(B) 因為吃太多東西而變得很胖", "(C) 說話非常有分量，說到做到", "(D) 每天都在討論美食，卻從來不吃"], "ans": 0, "exp": "出自《左傳》，把諾言吃下去讓自己變胖，比喻背信棄義。"}, {"id": 92, "type": "成語釋義", "q": "「斤斤計較」的意思最接近下列何者？", "opts": ["(A) 對微小的得失或無關緊要的小事過分計較", "(B) 買菜時非常仔細地計算重量與價錢", "(C) 為人非常慷慨大方，從不在意小錢", "(D) 數學計算能力非常強，從不出錯"], "ans": 0, "exp": "「斤斤」原指明察細微，後多用來形容在小事上過度算計。"}, {"id": 93, "type": "成語釋義", "q": "「脫穎而出」的意思最接近下列何者？", "opts": ["(A) 錐尖透過布袋顯露出來；比喻人的才能全部顯示出來，超越眾人", "(B) 因為表現太差而被淘汰出局", "(C) 把身上的外套脫下來掛在衣架上", "(D) 說話沒有重點，離題太遠"], "ans": 0, "exp": "出自《史記．平原君虞卿列傳》毛遂自薦的典故，「穎」指錐尖。"}, {"id": 94, "type": "成語釋義", "q": "「蹉跎歲月」的意思最接近下列何者？", "opts": ["(A) 虛度光陰，任由時間白白流逝而毫無作為", "(B) 非常珍惜時間，每天都在努力學習", "(C) 歲月過得非常快樂，令人難忘", "(D) 因為年紀大了，走路變得不方便"], "ans": 0, "exp": "「蹉跎」音ㄘㄨㄛ ㄊㄨㄛˊ，虛度光陰、失足跌倒之意。"}, {"id": 95, "type": "成語釋義", "q": "「精益求精」的意思最接近下列何者？", "opts": ["(A) 已經很好了，還要追求更加完美", "(B) 隨便做做就好，不要求品質", "(C) 精神非常疲倦，需要好好休息", "(D) 只挑簡單的事情做，困難的就放棄"], "ans": 0, "exp": "「益」作「更加」解，指好上加好，不斷追求卓越。"}, {"id": 96, "type": "成語釋義", "q": "「針鋒相對」的意思最接近下列何者？", "opts": ["(A) 針尖對著針尖；比喻雙方在言論、行動上尖銳對立，互不相讓", "(B) 兩個人感情非常好，總是站在同一陣線", "(C) 拿著針線在燈下縫補衣服", "(D) 說話非常委婉，不敢直接表達意見"], "ans": 0, "exp": "常用於形容辯論或衝突時雙方立場截然對立、互不相讓。"}, {"id": 97, "type": "成語釋義", "q": "「一步登天」的意思最接近下列何者？", "opts": ["(A) 踏出一步就登上天庭；比喻不經過努力就突然達到極高的境界或地位", "(B) 爬樓梯的時候一次跨好幾階", "(C) 腳踏實地，一步一步慢慢往上爬", "(D) 坐飛機飛上高空，看著窗外的雲海"], "ans": 0, "exp": "多含貶義，指妄想不勞而獲或驟然得志。"}, {"id": 98, "type": "成語釋義", "q": "「水乳交融」的意思最接近下列何者？", "opts": ["(A) 像水和乳汁融合在一起；比喻感情或關係非常融洽契合", "(B) 把水和牛奶倒在一起，結果變質壞掉了", "(C) 兩個人個性不合，經常發生爭執", "(D) 形容天氣非常潮濕，讓人覺得不舒服"], "ans": 0, "exp": "也常用來形容文章或藝術作品的情景交融。"}, {"id": 99, "type": "成語釋義", "q": "「敬業樂群」的意思最接近下列何者？", "opts": ["(A) 對自己的學業或工作專心致志，並與同學或同事相處融洽", "(B) 討厭自己的工作，也不喜歡和別人相處", "(C) 只喜歡和朋友玩樂，完全不顧學業", "(D) 每天都在換工作，無法安定下來"], "ans": 0, "exp": "出自《禮記．學記》，指專心於學業，樂於與同儕切磋相處。"}, {"id": 100, "type": "成語釋義", "q": "「南轅北轍」的意思最接近下列何者？", "opts": ["(A) 心裡想往南走，車子卻往北開；比喻行動與目的完全相反", "(B) 兩個人朝著同一個目標一起前進", "(C) 交通非常發達，往南往北都很方便", "(D) 迷路了，分不清楚東南西北"], "ans": 0, "exp": "「轅」指車前駕牲口的直木，「轍」指車輪壓出的痕跡。"}, {"id": 101, "type": "文意選填", "q": "面對老師的嚴厲指正，他不但沒有虛心檢討，反而______地找了許多藉口為自己辯解，讓老師非常失望。", "opts": ["(A) 文過飾非", "(B) 聞過則喜", "(C) 反躬自省", "(D) 虛懷若谷"], "ans": 0, "exp": "「文過飾非」指掩飾自己的過失與錯誤，不肯坦白承認。"}, {"id": 102, "type": "文意選填", "q": "這位音樂家對音準的要求極為嚴格，只要演奏中出現任何______的瑕疵，他都會立刻要求樂團重新排練。", "opts": ["(A) 微不足道", "(B) 舉足輕重", "(C) 茲事體大", "(D) 震古鑠今"], "ans": 0, "exp": "「微不足道」指非常渺小，不值得一提。"}, {"id": 103, "type": "文意選填", "q": "既然已經決定要參加全國演講比賽，就應該全力以赴、______，千萬不要半途而廢，讓先前的努力白費。", "opts": ["(A) 貫徹始終", "(B) 虎頭蛇尾", "(C) 有始無終", "(D) 半途而廢"], "ans": 0, "exp": "「貫徹始終」指從頭到尾都能徹底執行，堅持到底。"}, {"id": 104, "type": "文意選填", "q": "爸爸總是提醒我們，在外面與人相處要懂得尊重他人，切忌______，自以為高人一等而處處指使別人。", "opts": ["(A) 頤指氣使", "(B) 謙恭有禮", "(C) 和顏悅色", "(D) 平易近人"], "ans": 0, "exp": "「頤指氣使」形容傲慢、隨意指使別人的樣子。"}, {"id": 105, "type": "文意選填", "q": "颱風過境後，山區道路多處坍方中斷，救災人員必須______地翻山越嶺，才能將物資順利送進受困部落。", "opts": ["(A) 跋山涉水", "(B) 養尊處優", "(C) 枕戈待旦", "(D) 怡然自得"], "ans": 0, "exp": "「跋山涉水」形容旅途艱辛遙遠，翻越山嶺、蹚過河流。"}, {"id": 106, "type": "文意選填", "q": "寫作時應該用最精煉的文字表達深刻的內涵，如果整篇文章都在______，只會讓讀者覺得冗長乏味。", "opts": ["(A) 無病呻吟", "(B) 言簡意賅", "(C) 切中要害", "(D) 一針見血"], "ans": 0, "exp": "「無病呻吟」比喻沒有真情實感而故意矯揉造作。"}, {"id": 107, "type": "文意選填", "q": "遇到突發的危機時，領導者必須保持冷靜、______，才能在最短的時間內做出最正確的判斷。", "opts": ["(A) 當機立斷", "(B) 優柔寡斷", "(C) 舉棋不定", "(D) 瞻前顧後"], "ans": 0, "exp": "「當機立斷」指抓住時機，立刻做出果斷的決定，毫不猶豫。"}, {"id": 108, "type": "文意選填", "q": "雖然這對雙胞胎兄弟長得一模一樣，但兩人的個性卻______，哥哥活潑外向，弟弟則文靜內斂。", "opts": ["(A) 大相逕庭", "(B) 如出一轍", "(C) 毫無二致", "(D) 大同小異"], "ans": 0, "exp": "「大相逕庭」指彼此相差很遠，完全不同。"}, {"id": 109, "type": "文意選填", "q": "為了讓班級在運動會上獲得佳績，全班同學每天利用午休時間練習大隊接力，展現出______的團隊精神。", "opts": ["(A) 同心協力", "(B) 分崩離析", "(C) 離心離德", "(D) 勾心鬥角"], "ans": 0, "exp": "「同心協力」指團結一致，共同努力。"}, {"id": 110, "type": "文意選填", "q": "爺爺年輕時曾走遍大江南北，見識廣博，每當我們向他請教歷史典故時，他總能______，說得頭頭是道。", "opts": ["(A) 如數家珍", "(B) 一問三不知", "(C) 語無倫次", "(D) 支吾其詞"], "ans": 0, "exp": "「如數家珍」比喻對所講的事物非常熟悉，能清楚道來。"}, {"id": 111, "type": "文意選填", "q": "我們在網路上轉發任何消息之前，都應該先查證來源是否可靠，絕不能______，隨意散播未經證實的謠言。", "opts": ["(A) 道聽塗說", "(B) 實事求是", "(C) 追根究底", "(D) 尋根究底"], "ans": 0, "exp": "「道聽塗說」比喻沒有根據的傳聞。"}, {"id": 112, "type": "文意選填", "q": "這座國家公園擁有豐富的自然生態與壯麗的峽谷景觀，每年都吸引無數國內外遊客前來，令人______。", "opts": ["(A) 流連忘返", "(B) 避之唯恐不及", "(C) 望而生畏", "(D) 裹足不前"], "ans": 0, "exp": "「流連忘返」指留戀美好的景物或事物而捨不得離去。"}, {"id": 113, "type": "文意選填", "q": "小華在這次段考中成績大幅退步，主要是因為他平時上課總是______，沒有把老師講解的重點聽進去。", "opts": ["(A) 心不在焉", "(B) 全神貫注", "(C) 聚精會神", "(D) 專心致志"], "ans": 0, "exp": "「心不在焉」指心思不專注，精神不集中。"}, {"id": 114, "type": "文意選填", "q": "面對朋友的錯誤，我們應該善意提醒並協助改正，而不是在旁邊______，說一些風涼話嘲笑對方。", "opts": ["(A) 冷嘲熱諷", "(B) 苦口婆心", "(C) 推心置腹", "(D) 雪中送炭"], "ans": 0, "exp": "「冷嘲熱諷」指用尖刻辛辣的言語進行嘲笑和諷刺。"}, {"id": 115, "type": "文意選填", "q": "這位作家的文筆細膩動人，總能將日常生活中平凡的小事寫得______，讓讀者在閱讀時產生強烈的共鳴。", "opts": ["(A) 扣人心弦", "(B) 平淡無奇", "(C) 索然無味", "(D) 味同嚼蠟"], "ans": 0, "exp": "「扣人心弦」形容詩文、表演等非常生動感人，激動人心。"}, {"id": 116, "type": "文意選填", "q": "做事要懂得分清輕重緩急，如果總是______，把時間浪費在無關緊要的小事上，最後一定會誤了大事。", "opts": ["(A) 本末倒置", "(B) 輕重緩急", "(C) 提綱挈領", "(D) 綱舉目張"], "ans": 0, "exp": "「本末倒置」指把主要的和次要的、根本的和枝節的弄顛倒了。"}, {"id": 117, "type": "文意選填", "q": "雖然他過去曾犯過不少錯誤，但自從下定決心______之後，便日夜苦讀，終於考上了理想的學校。", "opts": ["(A) 洗心革面", "(B) 執迷不悟", "(C) 故態復萌", "(D) 變本加厲"], "ans": 0, "exp": "「洗心革面」指徹底悔改，重新做人。"}, {"id": 118, "type": "文意選填", "q": "兩人原本只是在公車上偶然相遇的陌生人，沒想到聊起天來卻______，一路從天文聊到地理，成為好朋友。", "opts": ["(A) 一見如故", "(B) 格格不入", "(C) 話不投機", "(D) 形同陌路"], "ans": 0, "exp": "「一見如故」指初次見面就像老朋友一樣投合。"}, {"id": 119, "type": "文意選填", "q": "遇到不懂的成語時，我們應該勤查字典弄清楚它的典故與用法，千萬不要______，隨便望文生義而鬧出笑話。", "opts": ["(A) 一知半解", "(B) 融會貫通", "(C) 豁然開朗", "(D) 了然於胸"], "ans": 0, "exp": "「一知半解」形容知道得不全面，理解得不透徹。"}, {"id": 120, "type": "文意選填", "q": "老師在黑板上畫了一隻展翅高飛的雄鷹，筆觸剛勁有力，神態______，贏得全班同學的熱烈掌聲。", "opts": ["(A) 栩栩如生", "(B) 死氣沉沉", "(C) 畫虎類犬", "(D) 弄巧成拙"], "ans": 0, "exp": "「栩栩如生」形容藝術作品或描寫非常逼真，好像活的一樣。"}, {"id": 121, "type": "文意選填", "q": "雖然這項科學實驗已經失敗了上百次，但研究團隊依然______，不斷調整參數，終於在今天取得了重大突破。", "opts": ["(A) 再接再厲", "(B) 功虧一簣", "(C) 灰心喪志", "(D) 退避三舍"], "ans": 0, "exp": "「再接再厲」指一次又一次地繼續努力，毫不鬆懈。"}, {"id": 122, "type": "文意選填", "q": "我們在學習傳統文化時，應該取其精華、去其糟粕，千萬不可______，連同過時的迷信觀念也全盤接受。", "opts": ["(A) 囫圇吞棗", "(B) 細嚼慢嚥", "(C) 含英咀華", "(D) 披沙揀金"], "ans": 0, "exp": "「囫圇吞棗」比喻讀書或學習不加分析思考，籠統接受。"}, {"id": 123, "type": "文意選填", "q": "看到同學因為比賽失利而難過落淚，大家紛紛上前安慰鼓勵，展現了同窗之間______的深厚情誼。", "opts": ["(A) 患難與共", "(B) 落井下石", "(C) 幸災樂禍", "(D) 隔岸觀火"], "ans": 0, "exp": "「患難與共」指共同承擔危險和困難，形容情誼深厚。"}, {"id": 124, "type": "文意選填", "q": "這位老教授一生致力於古典文學研究，著作等身，在學術界享有______的崇高地位。", "opts": ["(A) 舉足輕重", "(B) 無足輕重", "(C) 人微言輕", "(D) 寂寂無聞"], "ans": 0, "exp": "「舉足輕重」比喻處於重要地位，一舉一動都能影響大局。"}, {"id": 125, "type": "文意選填", "q": "只要我們平時養成良好的閱讀習慣，廣泛涉獵各類書籍，寫作時自然能夠文思泉湧、______。", "opts": ["(A) 妙筆生花", "(B) 江郎才盡", "(C) 搜腸刮肚", "(D) 絞盡腦汁"], "ans": 0, "exp": "「妙筆生花」比喻文筆極佳，寫作能力出眾。"}, {"id": 126, "type": "成語釋義", "q": "「文過飾非」的意思最接近下列何者？", "opts": ["(A) 掩飾自己的過失與錯誤，不肯坦白承認", "(B) 用優美的文章記錄別人的錯誤", "(C) 聽到別人指出自己的缺點就非常開心", "(D) 每天反省自己的行為是否有過失"], "ans": 0, "exp": "「文」與「飾」皆為掩飾之意，指用藉口掩蓋錯誤。"}, {"id": 127, "type": "成語釋義", "q": "「頤指氣使」的意思最接近下列何者？", "opts": ["(A) 不說話而用面部的表情示意；形容傲慢、隨意指使別人的樣子", "(B) 態度非常謙虛有禮，對每個人都和顏悅色", "(C) 臉部受傷，無法做出任何表情", "(D) 非常勤勞，所有的事情都自己動手做"], "ans": 0, "exp": "「頤」音ㄧˊ，下巴。用下巴示意、用神氣支使人，形容驕橫傲慢。"}, {"id": 128, "type": "成語釋義", "q": "「跋山涉水」的意思最接近下列何者？", "opts": ["(A) 翻越山嶺，蹚過河流；形容旅途艱辛遙遠", "(B) 喜歡在假日到郊外爬山和游泳", "(C) 交通非常便利，很快就能抵達目的地", "(D) 害怕爬山和水上活動，從不出門旅遊"], "ans": 0, "exp": "「跋」指在山上行走，「涉」指蹚水過河。"}, {"id": 129, "type": "成語釋義", "q": "「無病呻吟」的意思最接近下列何者？", "opts": ["(A) 沒有生病卻裝出痛苦呻吟的樣子；比喻沒有真情實感而故意矯揉造作", "(B) 生了重病卻不敢去看醫生", "(C) 身體非常健康，每天都充滿活力", "(D) 唱歌的聲音非常優美動聽"], "ans": 0, "exp": "多用於批評文章或言論內容空洞、故意做作。"}, {"id": 130, "type": "成語釋義", "q": "「當機立斷」的意思最接近下列何者？", "opts": ["(A) 抓住時機，立刻做出果斷的決定，毫不猶豫", "(B) 電腦突然當機了，必須立刻重新開機", "(C) 做事猶豫不決，總是拖延時間", "(D) 隨便亂做決定，完全不考慮後果"], "ans": 0, "exp": "「機」指時機、關鍵，形容處事果決明快。"}, {"id": 131, "type": "成語釋義", "q": "「大相逕庭」的意思最接近下列何者？", "opts": ["(A) 彼此相差很遠，完全不同", "(B) 兩條小路相通，走哪一條都可以", "(C) 兩件事情幾乎一模一樣，沒有差別", "(D) 家裡的庭院非常寬敞氣派"], "ans": 0, "exp": "「逕」指門外小路，「庭」指堂外院子，兩者相距甚遠。"}, {"id": 132, "type": "成語釋義", "q": "「如數家珍」的意思最接近下列何者？", "opts": ["(A) 好像在數自己家裡的珍寶一樣；比喻對所講的事物非常熟悉", "(B) 家裡收藏了許多價值連城的古董", "(C) 數學計算能力很差，連家裡的東西都數不清楚", "(D) 喜歡在別人面前炫耀自己很有錢"], "ans": 0, "exp": "「數」音ㄕㄨˇ，清點、列舉的意思。"}, {"id": 133, "type": "成語釋義", "q": "「道聽塗說」的意思最接近下列何者？", "opts": ["(A) 路上聽來的消息，就在路上隨便傳說；比喻沒有根據的傳聞", "(B) 在馬路上塗鴉畫畫，破壞市容", "(C) 說話很有道理，大家都願意聽從", "(D) 專門收集民間故事的學者"], "ans": 0, "exp": "出自《論語．陽貨》，「塗」同「途」，道路的意思。"}, {"id": 134, "type": "成語釋義", "q": "「流連忘返」的意思最接近下列何者？", "opts": ["(A) 留戀美好的景物或事物而捨不得離去", "(B) 迷路了，找不到回家的路", "(C) 覺得風景很無聊，迫不及待想要回家", "(D) 河水不停地流動，永遠不會回頭"], "ans": 0, "exp": "「流連」指留戀不捨，「返」指返回。"}, {"id": 135, "type": "成語釋義", "q": "「本末倒置」的意思最接近下列何者？", "opts": ["(A) 把主要的和次要的、根本的和枝節的弄顛倒了", "(B) 把書本的封面和封底裝反了", "(C) 做事非常有條理，能夠抓住重點", "(D) 樹木的根部和樹梢長得一樣粗壯"], "ans": 0, "exp": "「本」指樹根、根本；「末」指樹梢、枝節。"}, {"id": 136, "type": "成語釋義", "q": "「洗心革面」的意思最接近下列何者？", "opts": ["(A) 徹底悔改，重新做人", "(B) 每天早晚都要認真洗臉洗手，保持清潔", "(C) 表面上裝作改過，心裡卻依然如故", "(D) 換了一件新衣服，看起來精神煥發"], "ans": 0, "exp": "「革」指改變，指從內心到外表都徹底改過自新。"}, {"id": 137, "type": "成語釋義", "q": "「一見如故」的意思最接近下列何者？", "opts": ["(A) 初次見面就像老朋友一樣投合", "(B) 看見老朋友卻假裝不認識", "(C) 兩個人經常吵架，見面就眼紅", "(D) 看到古老的建築物感到非常親切"], "ans": 0, "exp": "「故」指故交、老朋友。"}, {"id": 138, "type": "成語釋義", "q": "「栩栩如生」的意思最接近下列何者？", "opts": ["(A) 形容藝術作品或描寫非常逼真，好像活的一樣", "(B) 蝴蝶在花叢中翩翩起舞的樣子", "(C) 畫得非常粗糙，完全看不出是什麼動物", "(D) 剛出生的小動物非常可愛"], "ans": 0, "exp": "「栩栩」音ㄒㄩˇ ㄒㄩˇ，生動活潑的樣子。"}, {"id": 139, "type": "成語釋義", "q": "「再接再厲」的意思最接近下列何者？", "opts": ["(A) 一次又一次地繼續努力，毫不鬆懈", "(B) 失敗一次就立刻放棄，不再嘗試", "(C) 態度非常嚴厲，經常責罵別人", "(D) 把斷掉的繩子重新接起來"], "ans": 0, "exp": "原指鬥雞時每次交鋒前先磨快雞嘴，後比喻繼續努力。注意「厲」不可寫成「勵」。"}, {"id": 140, "type": "成語釋義", "q": "「囫圇吞棗」的意思最接近下列何者？", "opts": ["(A) 把棗子整個吞下去，不加咀嚼；比喻讀書或學習不加分析思考，籠統接受", "(B) 吃東西非常急躁，結果被棗核噎到了", "(C) 細細品味食物的美味，吃得非常慢", "(D) 非常喜歡吃棗子，一次可以吃很多顆"], "ans": 0, "exp": "「囫圇」音ㄏㄨˊ ㄌㄨㄣˊ，整個、完整的意思。"}, {"id": 141, "type": "成語釋義", "q": "「舉足輕重」的意思最接近下列何者？", "opts": ["(A) 只要一抬腳就能影響兩邊的輕重；比喻處於重要地位，一舉一動都能影響大局", "(B) 走路的腳步非常沉重，好像背了很重的東西", "(C) 地位非常卑微，說話沒有人理會", "(D) 練習舉重時，腳步必須站穩"], "ans": 0, "exp": "形容關鍵人物或重要因素的影響力極大。"}, {"id": 142, "type": "成語釋義", "q": "「妙筆生花」的意思最接近下列何者？", "opts": ["(A) 比喻文筆極佳，寫作能力出眾", "(B) 毛筆的筆尖開叉了，需要換一支新筆", "(C) 畫家在紙上畫了許多美麗的花朵", "(D) 寫字非常潦草，讓人看不懂"], "ans": 0, "exp": "相傳李白少時夢見所用之筆頭上生花，後遂才思橫溢。"}, {"id": 143, "type": "成語釋義", "q": "「聞過則喜」的意思最接近下列何者？", "opts": ["(A) 聽到別人指出自己的過失就感到高興；形容虛心接受批評", "(B) 聽到別人犯錯就感到非常開心，幸災樂禍", "(C) 只要別人批評自己就立刻發脾氣", "(D) 喜歡到處打聽別人的隱私"], "ans": 0, "exp": "出自《孟子．公孫丑上》：「子路，人告之以有過，則喜。」"}, {"id": 144, "type": "成語釋義", "q": "「優柔寡斷」的意思最接近下列何者？", "opts": ["(A) 做事猶豫不決，缺乏果斷力", "(B) 性格非常溫柔體貼，善解人意", "(C) 做事非常果斷，從不拖泥帶水", "(D) 身體非常虛弱，需要好好調養"], "ans": 0, "exp": "「優柔」指猶豫不決，「寡斷」指缺乏決斷力。"}, {"id": 145, "type": "成語釋義", "q": "「如出一轍」的意思最接近下列何者？", "opts": ["(A) 好像出自同一個車輪的軌跡；比喻兩件事情非常相似，幾乎一模一樣", "(B) 車子走在泥濘的路上，留下深深的車輪印", "(C) 兩個人意見完全不同，無法達成共識", "(D) 迷失了方向，不知道該往哪裡走"], "ans": 0, "exp": "「轍」音ㄓㄜˊ，車輪輾過的痕跡。"}, {"id": 146, "type": "成語釋義", "q": "「同心協力」的意思最接近下列何者？", "opts": ["(A) 團結一致，共同努力", "(B) 大家各有各的想法，不願意合作", "(C) 一個人獨自承擔所有的工作", "(D) 表面上合作，暗地裡卻互相扯後腿"], "ans": 0, "exp": "「協」指合力、共同。"}, {"id": 147, "type": "成語釋義", "q": "「雪中送炭」的意思最接近下列何者？", "opts": ["(A) 在下雪天送木炭給受凍的人；比喻在別人急需的時候給予物質或精神上的幫助", "(B) 在大熱天送火爐給別人，完全不合時宜", "(C) 趁別人遇到困難時，故意打擊對方", "(D) 冬天到了，大家一起圍在火爐旁取暖"], "ans": 0, "exp": "反義成語為「落井下石」、「錦上添花」。"}, {"id": 148, "type": "成語釋義", "q": "「功虧一簣」的意思最接近下列何者？", "opts": ["(A) 堆九仞高的土山，只差一筐土而沒有完成；比喻事情只差最後一點努力而未能成功", "(B) 做事非常成功，獲得了巨大的成就", "(C) 一開始就失敗了，完全沒有成功的機會", "(D) 浪費了許多金錢和力氣，卻一無所獲"], "ans": 0, "exp": "出自《尚書．旅獒》，「簣」音ㄎㄨㄟˋ，盛土的竹筐。"}, {"id": 149, "type": "成語釋義", "q": "「退避三舍」的意思最接近下列何者？", "opts": ["(A) 主動退讓九十里；比喻對人讓步，不與相爭", "(B) 看到敵人就嚇得逃跑，躲進房子裡不敢出來", "(C) 房子太老舊了，需要重新整修", "(D) 堅持己見，一步也不肯退讓"], "ans": 0, "exp": "古代行軍三十里為一「舍」，三舍即九十里。出自晉文公重耳報答楚成王的典故。"}, {"id": 150, "type": "成語釋義", "q": "「江郎才盡」的意思最接近下列何者？", "opts": ["(A) 比喻文思枯竭，創作才能已經衰退或喪失", "(B) 才華洋溢，寫出來的文章深受大家喜愛", "(C) 每天都在江邊散步，尋找寫作靈感", "(D) 年紀輕輕就已經讀完了所有的書"], "ans": 0, "exp": "典出南朝梁文學家江淹晚年文思衰退的故事。"}, {"id": 151, "type": "文意選填", "q": "只要我們平時肯下功夫打好基礎，考試時自然能______，輕鬆應對各種靈活的題型。", "opts": ["(A) 得心應手", "(B) 束手無策", "(C) 左支右絀", "(D) 捉襟見肘"], "ans": 0, "exp": "「得心應手」指心裡怎麼想，手就能怎麼做，形容技藝純熟、運用自如。"}, {"id": 152, "type": "文意選填", "q": "這位年輕畫家的作品風格獨樹一幟，在國際畫展中大放異彩，可說是______。", "opts": ["(A) 後生可畏", "(B) 垂垂老矣", "(C) 墨守成規", "(D) 抱殘守缺"], "ans": 0, "exp": "「後生可畏」出自《論語》，指年輕人充滿潛力與希望，令人敬佩。"}, {"id": 153, "type": "文意選填", "q": "面對複雜的社會現象，我們應該保持客觀理性的態度，切勿______，只憑表面印象就妄下斷語。", "opts": ["(A) 以偏概全", "(B) 全面觀照", "(C) 客觀公正", "(D) 實事求是"], "ans": 0, "exp": "「以偏概全」指用片面的現象或少數例子來概括整體。"}, {"id": 154, "type": "文意選填", "q": "這對老夫妻相敬如賓、攜手走過半個世紀，鶼鰈情深的模樣真是令人______。", "opts": ["(A) 羨煞旁人", "(B) 嗤之以鼻", "(C) 視若無睹", "(D) 不以為然"], "ans": 0, "exp": "「羨煞旁人」形容非常令人羨慕。"}, {"id": 155, "type": "文意選填", "q": "每次遇到難題，他總是習慣找藉口推卸責任，從不反省自己，這種______的態度實在不可取。", "opts": ["(A) 怨天尤人", "(B) 反求諸己", "(C) 引咎自責", "(D) 嚴以律己"], "ans": 0, "exp": "「怨天尤人」指埋怨上天、責怪別人，形容遭遇挫折時不知反省而一味怪罪外在因素。"}, {"id": 156, "type": "文意選填", "q": "這本小說情節曲折離奇、懸疑重重，讓人一翻開就______，恨不得一口氣讀完。", "opts": ["(A) 愛不釋手", "(B) 棄如敝屣", "(C) 索然無味", "(D) 望而生厭"], "ans": 0, "exp": "「愛不釋手」指喜愛得捨不得放手。"}, {"id": 157, "type": "文意選填", "q": "雖然這件事已經過去多年，但每當回憶起老師當年的諄諄教誨，他依然______，感激不已。", "opts": ["(A) 銘感五內", "(B) 忘恩負義", "(C) 過河拆橋", "(D) 恩將仇報"], "ans": 0, "exp": "「銘感五內」指內心深深感激，永遠銘記在心。"}, {"id": 158, "type": "文意選填", "q": "我們在與人交往時應該真誠待人，如果總是戴著面具、______，終究無法交到知心朋友。", "opts": ["(A) 虛情假意", "(B) 肝膽相照", "(C) 披肝瀝膽", "(D) 推誠相見"], "ans": 0, "exp": "「虛情假意」指假裝出來的感情與心意，不真誠。"}, {"id": 159, "type": "文意選填", "q": "這座圖書館藏書豐富，宛如一座知識的寶庫，讓愛書人一走進去便如入寶山，感到______。", "opts": ["(A) 目不暇給", "(B) 一無所有", "(C) 貧乏無味", "(D) 枯燥乏味"], "ans": 0, "exp": "「目不暇給」形容美好的事物太多，眼睛看不過來。"}, {"id": 160, "type": "文意選填", "q": "面對排山倒海而來的課業壓力，我們要學會適當調適心情，如果整天______，反而會影響學習效率。", "opts": ["(A) 杞人憂天", "(B) 泰然自若", "(C) 處之泰然", "(D) 坦然面對"], "ans": 0, "exp": "「杞人憂天」比喻沒有根據或不必要的憂慮。"}, {"id": 161, "type": "文意選填", "q": "團隊合作最重要的是互相尊重與溝通，如果每個人都______、一意孤行，計畫肯定無法順利推動。", "opts": ["(A) 剛愎自用", "(B) 從善如流", "(C) 虛心納諫", "(D) 集思廣益"], "ans": 0, "exp": "「剛愎自用」指性情倔強固執，只憑主觀行事，不肯接受別人意見。"}, {"id": 162, "type": "文意選填", "q": "這場慈善音樂會吸引了眾多愛心人士共襄盛舉，大家紛紛______，為偏鄉學童籌募了豐厚的助學金。", "opts": ["(A) 慷慨解囊", "(B) 一毛不拔", "(C) 錙銖必較", "(D) 吝嗇小氣"], "ans": 0, "exp": "「慷慨解囊」指毫不吝嗇地拿出錢財幫助別人。"}, {"id": 163, "type": "文意選填", "q": "寫作文章最講求真情實感，若只是無病呻吟、______，就算用了再多華麗的詞彙也難以打動人心。", "opts": ["(A) 矯揉造作", "(B) 真情流露", "(C) 肺腑之言", "(D) 誠摯動人"], "ans": 0, "exp": "「矯揉造作」形容故意做作，不自然。"}, {"id": 164, "type": "文意選填", "q": "他在演講時引用了許多古今中外的名言佳句，旁徵博引、______，展現出深厚的文學造詣。", "opts": ["(A) 出口成章", "(B) 結結巴巴", "(C) 詞不達意", "(D) 語無倫次"], "ans": 0, "exp": "「出口成章」形容文思敏捷，口才極好，說出來的話就像文章一樣有條理。"}, {"id": 165, "type": "文意選填", "q": "這座跨海大橋歷經十年的艱辛施工，終於在今天順利通車，工程人員的辛勞可謂______。", "opts": ["(A) 功不可沒", "(B) 徒勞無功", "(C) 一事無成", "(D) 白費心機"], "ans": 0, "exp": "「功不可沒」指功勞極大，不可抹滅。"}, {"id": 166, "type": "文意選填", "q": "我們在學習新知識時，應該保持好奇心與求知慾，遇到疑問便______，直到徹底弄明白為止。", "opts": ["(A) 打破砂鍋問到底", "(B) 得過且過", "(C) 敷衍塞責", "(D) 不求甚解"], "ans": 0, "exp": "「打破砂鍋問到底」比喻追究事情的根源，非弄清楚不可。"}, {"id": 167, "type": "文意選填", "q": "這兩家公司的經營理念完全相反，合作起來就像______，最終只能以拆夥收場。", "opts": ["(A) 冰炭不容", "(B) 志同道合", "(C) 默契十足", "(D) 相得益彰"], "ans": 0, "exp": "「冰炭不容」比喻兩種事物或兩個人互相排斥，無法並存。"}, {"id": 168, "type": "文意選填", "q": "他雖然年紀輕輕，但處事沉穩老練，面對各種突發狀況都能______，令人刮目相看。", "opts": ["(A) 應付自如", "(B) 驚慌失措", "(C) 六神無主", "(D) 進退維谷"], "ans": 0, "exp": "「應付自如」指處理事情非常從容熟練，毫不費力。"}, {"id": 169, "type": "文意選填", "q": "讀書貴在持之以恆，每天進步一點點，日積月累下來便能______，取得驚人的成就。", "opts": ["(A) 水到渠成", "(B) 畫餅充飢", "(C) 緣木求魚", "(D) 空中樓閣"], "ans": 0, "exp": "「水到渠成」比喻條件成熟了，事情自然會成功。"}, {"id": 170, "type": "文意選填", "q": "這位政治人物在競選時開出了許多支票，當選後卻完全沒有兌現，簡直是______，令選民大失所望。", "opts": ["(A) 華而不實", "(B) 言出必行", "(C) 實至名歸", "(D) 身體力行"], "ans": 0, "exp": "「華而不實」指只會說好聽的話，卻沒有實際行動與成果。"}, {"id": 171, "type": "文意選填", "q": "在這個資訊爆炸的時代，我們必須具備獨立思考的能力，才不會在紛亂的訊息中______。", "opts": ["(A) 迷失方向", "(B) 洞察先機", "(C) 明辨是非", "(D) 瞭若指掌"], "ans": 0, "exp": "「迷失方向」指失去前進的目標或正確的判斷。"}, {"id": 172, "type": "文意選填", "q": "這部紀錄片真實呈現了保育人員守護台灣黑熊的艱辛過程，畫面感人肺腑，令人______。", "opts": ["(A) 肅然起敬", "(B) 嗤之以鼻", "(C) 漠不關心", "(D) 置身事外"], "ans": 0, "exp": "「肅然起敬」形容產生嚴肅敬仰的感情。"}, {"id": 173, "type": "文意選填", "q": "做人應該光明磊落、坦坦蕩蕩，千萬不要在背後______，破壞團體的和諧與信任。", "opts": ["(A) 搬弄是非", "(B) 排難解紛", "(C) 成人之美", "(D) 與人為善"], "ans": 0, "exp": "「搬弄是非」指在別人背後挑撥離間、製造糾紛。"}, {"id": 174, "type": "文意選填", "q": "經過多年的努力與耕耘，這家本土品牌終於在國際市場上______，成為台灣之光。", "opts": ["(A) 嶄露頭角", "(B) 銷聲匿跡", "(C) 默默無聞", "(D) 黯然失色"], "ans": 0, "exp": "「嶄露頭角」比喻顯露出卓越的才華或開始在某個領域取得成就。"}, {"id": 175, "type": "文意選填", "q": "無論遇到多大的困難，只要我們抱持著______的信念，勇往直前，就一定能戰勝逆境。", "opts": ["(A) 堅持不懈", "(B) 畏首畏尾", "(C) 裹足不前", "(D) 望風而逃"], "ans": 0, "exp": "「堅持不懈」指堅決保持下去，毫不鬆懈。"}, {"id": 176, "type": "成語釋義", "q": "「後生可畏」的意思最接近下列何者？", "opts": ["(A) 年輕人充滿潛力與希望，往往能超越前輩，令人敬佩", "(B) 年輕人脾氣暴躁，非常可怕", "(C) 後來出生的人都比較膽小怕事", "(D) 年長者應該害怕年輕人搶走工作"], "ans": 0, "exp": "出自《論語．子罕》：「後生可畏，焉知來者之不如今也？」"}, {"id": 177, "type": "成語釋義", "q": "「以偏概全」的意思最接近下列何者？", "opts": ["(A) 用片面的現象或少數例子來概括整體，不夠客觀", "(B) 考慮事情非常周全，沒有任何遺漏", "(C) 喜歡偏袒自己的好朋友", "(D) 把所有的東西都集中在一起"], "ans": 0, "exp": "「偏」指局部、片面，「概」指概括。"}, {"id": 178, "type": "成語釋義", "q": "「怨天尤人」的意思最接近下列何者？", "opts": ["(A) 埋怨上天、責怪別人；形容遭遇挫折時不知反省而一味怪罪外在因素", "(B) 非常感謝上天和周遭朋友的幫助", "(C) 每天都在祈求上天保佑平安", "(D) 遇到困難時總是先檢討自己的過失"], "ans": 0, "exp": "出自《論語．憲問》：「不怨天，不尤人。」「尤」作「責怪」解。"}, {"id": 179, "type": "成語釋義", "q": "「愛不釋手」的意思最接近下列何者？", "opts": ["(A) 喜愛得捨不得放手", "(B) 雙手受傷了，無法拿東西", "(C) 非常討厭這件物品，看都不想看", "(D) 隨手把東西丟在地上"], "ans": 0, "exp": "「釋」作「放下」解。"}, {"id": 180, "type": "成語釋義", "q": "「目不暇給」的意思最接近下列何者？", "opts": ["(A) 美好的事物太多，眼睛看不過來", "(B) 眼睛生病了，看不清楚東西", "(C) 風景非常單調，沒什麼好看的", "(D) 閉上眼睛休息，不願意看風景"], "ans": 0, "exp": "「暇」指空閒，「給」音ㄐㄧˇ，供應。形容景物繁多精彩。"}, {"id": 181, "type": "成語釋義", "q": "「杞人憂天」的意思最接近下列何者？", "opts": ["(A) 比喻沒有根據或不必要的憂慮", "(B) 氣象專家正在預測明天的天氣變化", "(C) 非常關心國家大事，日夜操勞", "(D) 遇到真正的危險卻一點也不擔心"], "ans": 0, "exp": "出自《列子．天瑞》，杞國有個人整天擔心天會塌下來。"}, {"id": 182, "type": "成語釋義", "q": "「剛愎自用」的意思最接近下列何者？", "opts": ["(A) 性情倔強固執，只憑主觀行事，不肯接受別人意見", "(B) 性格剛強正直，勇於承擔責任", "(C) 非常謙虛，樂於聽取大家的建議", "(D) 做事非常有彈性，懂得隨機應變"], "ans": 0, "exp": "「愎」音ㄅㄧˋ，固執、任性。"}, {"id": 183, "type": "成語釋義", "q": "「慷慨解囊」的意思最接近下列何者？", "opts": ["(A) 毫不吝嗇地拿出錢財幫助別人", "(B) 非常小氣，一毛錢也不肯捐出來", "(C) 把口袋裡的東西全部倒出來整理", "(D) 說話非常激動，充滿正義感"], "ans": 0, "exp": "「解囊」指打開錢袋，形容樂善好施。"}, {"id": 184, "type": "成語釋義", "q": "「矯揉造作」的意思最接近下列何者？", "opts": ["(A) 形容故意做作，不自然", "(B) 動作非常自然流暢，毫不拘束", "(C) 工匠正在細心地雕刻木頭", "(D) 性格非常率真，有什麼說什麼"], "ans": 0, "exp": "「矯」指把彎的弄直，「揉」指把直的弄彎，比喻刻意裝腔作勢。"}, {"id": 185, "type": "成語釋義", "q": "「出口成章」的意思最接近下列何者？", "opts": ["(A) 形容文思敏捷，口才極好，說出來的話就像文章一樣有條理", "(B) 剛走出門口就看到一篇文章", "(C) 說話結結巴巴，半天講不出一句話", "(D) 喜歡在別人面前背誦古文"], "ans": 0, "exp": "稱讚人極具文學才華與口才。"}, {"id": 186, "type": "成語釋義", "q": "「水到渠成」的意思最接近下列何者？", "opts": ["(A) 水流到的地方自然形成溝渠；比喻條件成熟了，事情自然會成功", "(B) 工人正在挖掘水溝，準備引水灌溉", "(C) 洪水氾濫成災，沖毀了農田", "(D) 事情非常困難，永遠不可能成功"], "ans": 0, "exp": "強調只要準備充分、條件具備，成功便是自然而然的事。"}, {"id": 187, "type": "成語釋義", "q": "「肅然起敬」的意思最接近下列何者？", "opts": ["(A) 形容產生嚴肅敬仰的感情", "(B) 態度非常傲慢，看不起別人", "(C) 感到非常害怕，全身發抖", "(D) 氣氛非常嚴肅，大家都不敢說話"], "ans": 0, "exp": "「肅然」指恭敬的樣子。"}, {"id": 188, "type": "成語釋義", "q": "「搬弄是非」的意思最接近下列何者？", "opts": ["(A) 在別人背後挑撥離間、製造糾紛", "(B) 幫忙把重物搬運到正確的地方", "(C) 非常公正地判斷事情的對錯", "(D) 喜歡幫助別人解決困難"], "ans": 0, "exp": "指故意把別人的話傳來傳去，挑起爭端。"}, {"id": 189, "type": "成語釋義", "q": "「嶄露頭角」的意思最接近下列何者？", "opts": ["(A) 比喻顯露出卓越的才華或開始在某個領域取得成就", "(B) 頭上長出角來，樣子非常奇怪", "(C) 躲在角落裡不敢出來見人", "(D) 表現平平，沒有任何特別之處"], "ans": 0, "exp": "「嶄」音ㄓㄢˇ，高峻、突出的樣子，多用來形容年輕人開始展現才華。"}, {"id": 190, "type": "成語釋義", "q": "「望塵莫及」的意思最接近下列何者？", "opts": ["(A) 望見前面騎馬的人揚起的塵土而不能趕上；比喻遠遠落後", "(B) 視力非常好，連遠處的灰塵都看得一清二楚", "(C) 跑得非常快，一下子就追上了前面的人", "(D) 空氣品質很差，到處都是飛揚的塵土"], "ans": 0, "exp": "常用於謙稱自己不如別人，或形容差距極大。"}, {"id": 191, "type": "成語釋義", "q": "「畫蛇添足」的意思最接近下列何者？", "opts": ["(A) 畫好了蛇，又多畫了腳；比喻多此一舉，反而弄巧成拙", "(B) 畫畫技術非常高超，把蛇畫得栩栩如生", "(C) 做事非常細心，連最微小的細節都照顧到了", "(D) 蛇本來就有腳，只是平常藏起來了"], "ans": 0, "exp": "出自《戰國策．齊策二》，諷刺多餘而不恰當的行為。"}, {"id": 192, "type": "成語釋義", "q": "「守株待兔」的意思最接近下列何者？", "opts": ["(A) 比喻不知變通，死守狹隘經驗，或妄想不勞而獲", "(B) 獵人非常有耐心地在樹林裡打獵", "(C) 非常愛護小動物，每天都在樹下餵兔子", "(D) 懂得隨機應變，靈活調整策略"], "ans": 0, "exp": "出自《韓非子．五蠹》，宋國農夫偶得撞樹而死的兔子，便天天守在樹旁等待。"}, {"id": 193, "type": "成語釋義", "q": "「揠苗助長」的意思最接近下列何者？", "opts": ["(A) 把禾苗拔高以幫助它生長；比喻違反事物發展規律，急於求成反而壞事", "(B) 農夫非常勤勞地幫農作物除草施肥", "(C) 植物長得非常茂盛，很快就收成了", "(D) 循序漸進地培養孩子的興趣"], "ans": 0, "exp": "出自《孟子．公孫丑上》，「揠」音ㄧㄚˋ，拔的意思。"}, {"id": 194, "type": "成語釋義", "q": "「敝帚自珍」的意思最接近下列何者？", "opts": ["(A) 把自己家裡的破掃帚當成寶貝一樣珍視；比喻東西雖不好，自己卻十分珍惜", "(B) 非常喜歡打掃家裡，把地板掃得一塵不染", "(C) 嫌棄家裡的東西太舊，全部丟掉買新的", "(D) 收藏了許多價值連城的古董字畫"], "ans": 0, "exp": "「敝」指破舊，「帚」指掃帚。常用作謙詞，稱自己的詩文或物品。"}, {"id": 195, "type": "成語釋義", "q": "「井底之蛙」的意思最接近下列何者？", "opts": ["(A) 住在井底的青蛙只能看到井口那麼大的一片天；比喻見識狹小的人", "(B) 青蛙非常喜歡待在涼爽的水井裡游泳", "(C) 知識非常淵博，通曉古今中外的事情", "(D) 跳得非常高，一下子就跳出了水井"], "ans": 0, "exp": "出自《莊子．秋水》，諷刺眼界狹隘卻自以為是的人。"}, {"id": 196, "type": "成語釋義", "q": "「刻舟求劍」的意思最接近下列何者？", "opts": ["(A) 比喻拘泥固執，不知隨著情勢的變化而變通", "(B) 在船上雕刻精美的圖案，手藝非常高超", "(C) 掉進水裡的寶劍很快就找回來了", "(D) 非常珍惜自己的寶劍，隨身攜帶"], "ans": 0, "exp": "出自《呂氏春秋．察今》，船已移動卻仍在船舷刻記號找劍。"}, {"id": 197, "type": "成語釋義", "q": "「自相矛盾」的意思最接近下列何者？", "opts": ["(A) 比喻自己的言行前後抵觸、互不相容", "(B) 武器非常精良，既有鋒利的矛又有堅固的盾", "(C) 說話非常有邏輯，讓人無懈可擊", "(D) 兩個人拿著武器互相攻擊"], "ans": 0, "exp": "出自《韓非子．難一》，賣矛與盾的商人誇口矛無所不刺、盾無物能破。"}, {"id": 198, "type": "成語釋義", "q": "「亡羊補牢」的意思最接近下列何者？", "opts": ["(A) 羊丟失了才修補羊圈；比喻出了差錯後及時設法補救，還不算太晚", "(B) 羊全部跑光了，再修補羊圈也已經沒用了", "(C) 牧羊人非常懶惰，從不修理破掉的羊圈", "(D) 事前做好萬全準備，沒有發生任何意外"], "ans": 0, "exp": "出自《戰國策．楚策四》，強調發現錯誤後及時補救的重要性。"}, {"id": 199, "type": "成語釋義", "q": "「杯弓蛇影」的意思最接近下列何者？", "opts": ["(A) 把酒杯裡弓的倒影誤以為是蛇；比喻疑神疑鬼，自相驚擾", "(B) 酒杯上雕刻著弓箭和蛇的精美花紋", "(C) 真的有一條毒蛇掉進了酒杯裡", "(D) 膽子非常大，遇到危險一點也不害怕"], "ans": 0, "exp": "出自《風俗通義》，形容因過度疑慮而產生恐懼。"}, {"id": 200, "type": "成語釋義", "q": "「葉公好龍」的意思最接近下列何者？", "opts": ["(A) 比喻表面上愛好某事物，實際上並不真愛好，甚至畏懼它", "(B) 非常喜歡研究恐龍的化石與歷史", "(C) 對某項事物熱愛到廢寢忘食的地步", "(D) 畫龍的技術非常高超，簡直維妙維肖"], "ans": 0, "exp": "出自漢代劉向《新序．雜事》，諷刺口是心非、表裡不一的人。"}];

    function loadState() {
      try {
        const raw = localStorage.getItem(APP_STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(defaultState),
          ...parsed,
          q1: { ...structuredClone(defaultState.q1), ...(parsed.q1 || {}) },
          q2: { ...structuredClone(defaultState.q2), ...(parsed.q2 || {}) },
          q3: { ...structuredClone(defaultState.q3), ...(parsed.q3 || {}) },
          civics: { ...structuredClone(defaultState.civics), ...(parsed.civics || {}) }
        };
      } catch (err) {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        // Ignore storage quota errors safely
      }
    }

    function showToast(msg) {
      const banner = document.getElementById("toast-banner");
      const textEl = document.getElementById("toast-message");
      if (!banner || !textEl) return;
      textEl.textContent = msg;
      banner.classList.remove("hidden");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add("hidden");
      }, 3200);
    }

    function hideToast() {
      const banner = document.getElementById("toast-banner");
      if (banner) banner.classList.add("hidden");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function shuffleIndices(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getQ1Pool() {
      const f = state.q1.filter || "全部";
      const wrongMode = !!state.q1.wrongMode;
      const wrongIds = state.q1.wrongIds || [];
      return QUIZ1_BANK
        .map((item, idx) => ({ ...item, id: idx }))
        .filter((item) => (f === "全部" || item.t === f) && (!wrongMode || wrongIds.includes(item.id)));
    }

    function rebuildQ1Order(forceShuffle = null) {
      const pool = getQ1Pool();
      const ids = pool.map((p) => p.id);
      const shouldShuffle = forceShuffle !== null ? forceShuffle : !!state.q1.shuffle;
      state.q1.order = shouldShuffle ? shuffleIndices(ids) : ids;
      state.q1.answers = {};
      saveState();
    }

    function initAndRenderQ1() {
      const pool = getQ1Pool();
      const poolSet = new Set(pool.map((p) => p.id));
      if (!Array.isArray(state.q1.order) || state.q1.order.length === 0 || !state.q1.order.every((id) => poolSet.has(id)) || state.q1.order.length !== pool.length) {
        state.q1.order = state.q1.shuffle ? shuffleIndices(pool.map((p) => p.id)) : pool.map((p) => p.id);
        saveState();
      }
      renderQ1();
    }

          <!-- Completion Summary Box -->
          ${isComplete ? `

          <!-- Questions List -->
          ${activeList.length ? activeList.map((q, n) => {
            const chosen = answers[n];

            return `

                      cls += "bg-emerald-50 border-emerald-500 text-emerald-950 font-bold cursor-default";
